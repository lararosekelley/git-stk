[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# release.yml is hand-edited: the `host` job's `if` is patched to require the
# custom-e2e gate to succeed (dist doesn't gate host/announce on plan-jobs, only
# the build jobs - see the comment in release.yml). allow-dirty stops `dist
# generate`/`dist plan` from clobbering or rejecting that edit. Re-apply the
# patch by hand after any intentional `dist generate`.
allow-dirty = ["ci"]
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Homebrew tap to publish the generated formula to (the repo must exist and
# the release workflow needs a token that can push to it).
tap = "lararosekelley/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax). Linux is
# static musl: it has no C deps (reqwest uses rustls, not OpenSSL), so the
# binary runs on any Linux - glibc, Alpine, or an older distro - from one
# artifact per arch.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Where installers place the binary. A neutral, non-Rust location so a
# curl|bash user doesn't get it dropped in ~/.cargo/bin (which dist used to do
# via CARGO_HOME, even for people who have never installed Rust); dist wires
# this dir onto PATH in the installer.
install-path = "~/.local/bin"
# Where to host releases
hosting = "github"
# Pre-release gate: run the live e2e suite (.github/workflows/e2e.yml) right
# after `plan`, so a failing live run against GitHub/GitLab blocks the release
# before anything is built or published. Needs the E2E_GH_TOKEN / E2E_GITLAB_TOKEN
# repo secrets.
plan-jobs = ["./e2e"]
# Publish to crates.io after the release builds succeed, via the custom
# reusable workflow in .github/workflows/publish-crates.yml (needs the
# CARGO_REGISTRY_TOKEN repo secret)
publish-jobs = ["homebrew", "./publish-crates"]
# Whether to install an updater program
install-updater = false
# Printed by the shell/powershell installers after a successful install.
# NB: no backticks - the installer prints this as a shell literal, so `...`
# would be command-substituted (i.e. actually run) at install time.
install-success-msg = "git-stk installed! Run 'git stk setup' to install the man page and shell completions."

[dist.binaries]
aarch64-apple-darwin = ["git-stk"]
aarch64-unknown-linux-musl = ["git-stk"]
x86_64-apple-darwin = ["git-stk"]
x86_64-unknown-linux-musl = ["git-stk"]
x86_64-pc-windows-msvc = ["git-stk"]
