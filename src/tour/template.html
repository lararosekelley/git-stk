<style>
:root {
  /* Catppuccin Latte */
  --bg: #eff1f5;
  --bg-soft: #e6e9ef;
  --fg: #4c4f69;
  --fg-muted: #6c6f85;
  --border: #ccd0da;
  --accent: #1e66f5;
  --accent-fg: #eff1f5;
  --add-bg: #d6e6d9;
  --add-num: #c2dcc0;
  --del-bg: #ebd1db;
  --del-num: #e7b6c4;
  --hunk-bg: #dae3f5;
  --empty-bg: #e6e9ef;
  --done: #40a02b;
  --removed: #d20f39;
  --hl-keyword: #8839ef;
  --hl-string: #40a02b;
  --hl-comment: #7c7f93;
  --hl-title: #1e66f5;
  --hl-constant: #fe640b;
  --hl-type: #df8e1d;
  --hl-tag: #1e66f5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    /* Catppuccin Mocha */
    --bg: #1e1e2e;
    --bg-soft: #181825;
    --fg: #cdd6f4;
    --fg-muted: #a6adc8;
    --border: #313244;
    --accent: #89b4fa;
    --accent-fg: #1e1e2e;
    --add-bg: #343e40;
    --add-num: #475950;
    --del-bg: #402f42;
    --del-num: #5e3f53;
    --hunk-bg: #2b3046;
    --empty-bg: #181825;
    --done: #a6e3a1;
    --removed: #f38ba8;
    --hl-keyword: #cba6f7;
    --hl-string: #a6e3a1;
    --hl-comment: #9399b2;
    --hl-title: #89b4fa;
    --hl-constant: #fab387;
    --hl-type: #f9e2af;
    --hl-tag: #89b4fa;
  }
}
:root[data-theme="dark"] {
  --bg: #1e1e2e;
  --bg-soft: #181825;
  --fg: #cdd6f4;
  --fg-muted: #a6adc8;
  --border: #313244;
  --accent: #89b4fa;
  --accent-fg: #1e1e2e;
  --add-bg: #343e40;
  --add-num: #475950;
  --del-bg: #402f42;
  --del-num: #5e3f53;

  --empty-bg: #181825;
  --done: #a6e3a1;
  --removed: #f38ba8;

  --hl-string: #a6e3a1;
  --hl-comment: #9399b2;
  --hl-title: #89b4fa;
  --hl-constant: #fab387;
  --hl-type: #f9e2af;
  --hl-tag: #89b4fa;
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--header-height, 0px) + 16px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}
a { color: var(--accent); }
code, pre, .diff { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
button {
  font: inherit; font-size: 12px; color: var(--fg); background: var(--bg);
  border: 1px solid var(--border); border-radius: 6px; padding: 2px 10px; cursor: pointer;
}
button:hover { border-color: var(--accent); }
button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 100vh; }
.layout.nav-hidden { grid-template-columns: minmax(0, 1fr); }
.layout.nav-hidden nav { display: none; }
nav {
  position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto;
  border-right: 1px solid var(--border); background: var(--bg-soft); padding: 16px;
}
nav h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--fg-muted); margin: 0 0 8px; }
nav ol { list-style: none; margin: 0; padding: 0; }
nav li.step { margin-bottom: 12px; }
nav .step-row { display: flex; align-items: center; gap: 6px; }
nav .step-row input { margin: 0; }
nav .step-link { font-weight: 600; color: var(--fg); text-decoration: none; }
nav .step-link.done { color: var(--done); }
nav .step-files { margin: 4px 0 0 20px; }
nav .step-files a { display: block; color: var(--fg-muted); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
nav .step-files a:hover, nav .step-link:hover { text-decoration: underline; }
nav .progress { margin-bottom: 16px; color: var(--fg-muted); }
nav .chapters { margin-bottom: 4px; }
nav .chapter { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
nav .chapter-link {
  flex: 1; min-width: 0; color: var(--fg); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  border-left: 2px solid var(--border); padding: 2px 0 2px 8px;
}
nav .chapter-link:hover { text-decoration: underline; }
nav .chapter-link[aria-current="page"] { border-left-color: var(--accent); font-weight: 600; }
nav .chapter-id { color: var(--fg-muted); }
nav .chapter-progress { color: var(--fg-muted); font-size: 12px; }
nav .chapter-progress.done { color: var(--done); }
nav .chapters-base { color: var(--fg-muted); font-size: 12px; margin: 0 0 20px 10px; }
main { padding: 0 32px 64px; min-width: 0; }
main > header {
  position: sticky; top: 0; z-index: 3; background: var(--bg);
  padding: 24px 0 12px; border-bottom: 1px solid var(--border); margin-bottom: 16px;
}
.header-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 4px; }
header h1 { font-size: 24px; margin: 0; overflow-wrap: anywhere; flex: 1; }
.icon-button { padding: 5px; line-height: 0; color: var(--fg-muted); }
.icon-button:hover { color: var(--fg); }
.nav-toggle { margin-top: 4px; }
.meta { color: var(--fg-muted); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.state { border: 1px solid var(--border); border-radius: 999px; padding: 0 8px; font-size: 12px; }
.toolbar { display: flex; gap: 6px; align-items: center; margin-top: 12px; color: var(--fg-muted); }
.intro { margin: 16px 0 32px; display: grid; gap: 16px; }
.panel { border: 1px solid var(--border); border-radius: 6px; padding: 12px 16px; background: var(--bg-soft); }
.panel h2 { font-size: 14px; margin: 0 0 8px; }
.markdown { overflow-wrap: anywhere; }
.markdown > :first-child { margin-top: 0; }
.markdown > :last-child { margin-bottom: 0; }
.markdown h1, .markdown h2, .markdown h3, .markdown h4 { margin: 16px 0 8px; line-height: 1.25; }
.markdown h1 { font-size: 20px; }
.markdown h2 { font-size: 17px; }
.markdown h3, .markdown h4 { font-size: 15px; }
.markdown p, .markdown ul, .markdown ol, .markdown blockquote, .markdown pre, .markdown table { margin: 0 0 12px; }
.markdown ul, .markdown ol { padding-left: 24px; }
.markdown li:has(> input[type="checkbox"]) { list-style: none; margin-left: -20px; }
.markdown code { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
.markdown pre { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; overflow-x: auto; }
.markdown pre code { border: 0; padding: 0; background: none; }
.markdown blockquote { border-left: 3px solid var(--border); padding-left: 12px; color: var(--fg-muted); }
.markdown table { border-collapse: collapse; display: block; overflow-x: auto; }
.markdown th, .markdown td { border: 1px solid var(--border); padding: 4px 10px; }
.markdown hr { border: 0; border-top: 1px solid var(--border); }
.commits { list-style: none; margin: 0; padding: 0; }
.commits code { color: var(--fg-muted); margin-right: 8px; }
section.step { margin-bottom: 40px; }
.step-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 16px; }
.step-head h2 { font-size: 18px; margin: 0; }
.step-head label { color: var(--fg-muted); white-space: nowrap; cursor: pointer; }
.file { border: 1px solid var(--border); border-radius: 6px; margin-bottom: 16px; }
.file > summary {
  list-style: none; cursor: pointer; display: flex; gap: 8px; align-items: center;
  padding: 8px 12px; background: var(--bg-soft); position: sticky; top: var(--header-height, 0px); z-index: 1;
  border-radius: 6px;
}
.file[open] > summary { border-bottom: 1px solid var(--border); border-radius: 6px 6px 0 0; }
.file > summary::-webkit-details-marker { display: none; }
.file > summary::before { content: ">"; color: var(--fg-muted); font-family: ui-monospace, monospace; transition: transform .1s; }
.file[open] > summary::before { transform: rotate(90deg); }
.file-path { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; overflow-wrap: anywhere; flex: 1; }
.file-status { font-size: 12px; color: var(--fg-muted); }
.count-add { color: var(--done); font-size: 12px; }
.count-del { color: var(--removed); font-size: 12px; }
table.diff { border-collapse: collapse; width: 100%; table-layout: fixed; }
.diff td { padding: 0 8px; vertical-align: top; line-height: 20px; }
.diff td.code { white-space: pre-wrap; overflow-wrap: anywhere; }
.diff col.num { width: 56px; }
.diff col.sign { width: 20px; }
.diff td.num { text-align: right; color: var(--fg-muted); user-select: none; }
.diff td.sign { padding: 0 0 0 6px; user-select: none; }
.diff td.add { background: var(--add-bg); }
.diff td.num.add { background: var(--add-num); }
.diff td.del { background: var(--del-bg); }
.diff td.num.del { background: var(--del-num); }
.diff td.empty { background: var(--empty-bg); }
.diff tr.hunk td { background: var(--hunk-bg); color: var(--fg-muted); padding: 4px 8px; }
.diff tr.hunk button { margin-right: 6px; }
.diff tr.hunk span { white-space: pre-wrap; overflow-wrap: anywhere; }
.note { padding: 12px; color: var(--fg-muted); }
.next { display: inline-block; margin-top: 4px; }
.comment-count { font-size: 12px; color: var(--fg-muted); border: 1px solid var(--border); border-radius: 999px; padding: 0 8px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.panel-head h2 { margin: 0; }
.timeline-item { border-top: 1px solid var(--border); padding-top: 8px; margin-top: 8px; }
.verdict { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 0 8px; margin-bottom: 4px; border: 1px solid var(--border); }
.verdict-approved { color: var(--done); border-color: var(--done); }
.verdict-changes_requested { color: var(--removed); border-color: var(--removed); }
.thread { border: 1px solid var(--border); border-radius: 6px; background: var(--bg); margin: 6px 0; padding: 4px 12px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; white-space: normal; }
.thread.resolved > summary { cursor: pointer; color: var(--fg-muted); padding: 4px 0; }
.comment { padding: 6px 0; }
.comment + .comment { border-top: 1px solid var(--border); }
.comment-meta { color: var(--fg-muted); font-size: 12px; margin-bottom: 2px; }
.comment-meta strong { color: var(--fg); }
.comment-meta a { color: var(--fg-muted); }
.diff tr.thread-row td { background: var(--bg-soft); padding: 4px 8px; }
.file-notes:empty { display: none; }
.file-notes { padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--bg-soft); }
.note-label { font-size: 12px; color: var(--fg-muted); margin-top: 6px; }
.outdated > summary { cursor: pointer; color: var(--fg-muted); font-size: 12px; padding: 4px 0; }
.thread-hunk { margin: 4px 0; padding: 6px 8px; background: var(--bg-soft); border: 1px solid var(--border); border-radius: 4px; overflow-x: auto; }
td.num.commentable { cursor: pointer; }
td.num.commentable:hover { color: var(--accent); text-decoration: underline; }
.editor { margin: 6px 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; white-space: normal; }
.editor textarea, .review-panel textarea { width: 100%; font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; resize: vertical; }
.editor-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 6px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.thread.pending { border-style: dashed; }
.pending-label { font-size: 12px; font-weight: 600; color: var(--accent); }
.draft-body { white-space: pre-wrap; padding: 4px 0 6px; }
.review-button { margin-left: auto; }
.draft-count:empty { display: none; }
.draft-count { background: var(--accent); color: var(--accent-fg); border-radius: 999px; padding: 0 6px; margin-left: 2px; }
.review-panel {
  position: fixed; top: 16px; right: 16px; z-index: 10; width: min(420px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow-y: auto;
  background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
}
.review-panel h2 { font-size: 16px; margin: 0 0 8px; }
.review-events { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 8px 0; }
.review-comments { margin: 4px 0 8px; padding-left: 18px; font-size: 13px; }
.review-status { margin-top: 8px; color: var(--fg-muted); }
.review-status.failed { color: var(--removed); }
.review-status.posted { color: var(--done); }
.thread-actions { display: flex; align-items: center; gap: 6px; padding: 4px 0 6px; }
.action-status { color: var(--fg-muted); font-size: 12px; }
.action-status.failed { color: var(--removed); }
.comment-box { border-top: 1px solid var(--border); padding-top: 8px; margin-top: 8px; }
.chapter-nav { display: flex; justify-content: space-between; gap: 16px; border-top: 1px solid var(--border); padding-top: 16px; }
.chapter-nav a { color: var(--accent); text-decoration: none; }
.chapter-nav a:last-child { text-align: right; }
.chapter-nav a:hover { text-decoration: underline; }
.hljs-keyword, .hljs-meta .hljs-keyword, .hljs-template-tag, .hljs-type.hljs-keyword, .hljs-variable.language_ { color: var(--hl-keyword); }
.hljs-string, .hljs-regexp, .hljs-meta .hljs-string, .hljs-char.escape_ { color: var(--hl-string); }
.hljs-comment, .hljs-code, .hljs-formula, .hljs-quote { color: var(--hl-comment); }
.hljs-title, .hljs-title.function_, .hljs-title.class_, .hljs-section, .hljs-doctag { color: var(--hl-title); }
.hljs-number, .hljs-literal, .hljs-attr, .hljs-attribute, .hljs-variable, .hljs-template-variable, .hljs-meta, .hljs-property, .hljs-operator, .hljs-selector-attr, .hljs-selector-class, .hljs-selector-id { color: var(--hl-constant); }
.hljs-built_in, .hljs-type, .hljs-params, .hljs-symbol, .hljs-subst, .hljs-bullet { color: var(--hl-type); }
.hljs-name, .hljs-tag, .hljs-selector-tag, .hljs-selector-pseudo { color: var(--hl-tag); }
.hljs-emphasis { font-style: italic; }
.hljs-strong, .hljs-section { font-weight: 600; }
.hljs-link { text-decoration: underline; }
@media (max-width: 800px) {
  .layout { display: block; }
  nav { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--border); }
  main { padding: 0 16px 16px; }
  main > header { padding-top: 16px; }
  .diff col.num { width: 40px; }
}
</style>

<script>

  var themeKey = "git-stk-tour:theme";
  var navKey = "git-stk-tour:nav-hidden";
  var darkQuery = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;

  var chapter = null;
  var reviewedKey = "";
  var reviewed = {};
  var views = [];
  var observer = null;

  function readStorage(key, fallback) {

    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  // Split highlighted HTML into lines, closing the spans still open at each

  // its own while multi-line strings and comments keep their color.
  function splitHighlighted(html) {
    var lines = [];

    var token = /(<span[^>]*>)|(<\/span>)|(\n)|([^<\n]+)/g;
    var match;

  function textLines(text) {

  function firstNew(hunk) { return hunk.newLines === 0 ? hunk.newStart + 1 : hunk.newStart; }

  function buildSide(file, side) {

  function FileView(file, stepIndex, fileIndex, collapsed) {

      el("span", { class: "count-add", text: "+" + file.additions }),
      el("span", { class: "count-del", text: "-" + file.deletions }),
      this.threads.length ? el("span", { class: "comment-count", title: "Comment threads", text: this.threads.length + " " + (this.threads.length === 1 ? "thread" : "threads") }) : null,
    ]);
    this.body = el("div");
    var details = el("details", { class: "file", id: this.anchor }, [summary, this.body]);
    details.open = !collapsed;
    var view = this;
    details.addEventListener("toggle", function () {
      if (details.open && view.visible && !view.rendered) view.render();
    });
    return details;
  };

  // The unchanged stretches before each hunk and after the last, in new-file
  // line numbers, each with how much of it has been revealed from either end.
  FileView.prototype.buildGaps = function () {
    var hunks = this.file.hunks;
    var expandable = this.sides.old.full && this.sides.new.full;
    var gaps = hunks.map(function (hunk, index) {
      var previous = hunks[index - 1];
      var from = previous ? firstNew(previous) + previous.newLines : 1;
      return { from: from, to: firstNew(hunk) - 1, offset: firstOld(hunk) - firstNew(hunk), top: 0, bottom: 0 };
    });
    var last = hunks[hunks.length - 1];
    var end = firstNew(last) + last.newLines;
    gaps.push({
      from: end,
      to: expandable ? this.sides.new.count : end - 1,
      offset: firstOld(last) + last.oldLines - end,
      top: 0,
      bottom: 0,
    });
    gaps.forEach(function (gap) { gap.expandable = expandable; });
    return gaps;
  };

  FileView.prototype.render = function () {
    var file = this.file;
    this.rendered = true;
    this.body.textContent = "";
    this.placed = [];
    if (file.binary) {
      this.body.appendChild(el("div", { class: "note", text: "Binary file not shown." }));
      this.body.appendChild(this.fileNotes());
      return;
    }
    if (!file.hunks.length) {
      var reason = file.status === "renamed" ? "Renamed without changes." : "No content changes.";
      this.body.appendChild(el("div", { class: "note", text: reason }));
      this.body.appendChild(this.fileNotes());
      return;
    }
    if (!this.sides) {
      this.sides = { old: buildSide(file, "old"), new: buildSide(file, "new") };
      this.gaps = this.buildGaps();
    }
    var rows = this.rows();
    var table = layout === "split" ? this.splitTable(rows) : this.unifiedTable(rows);
    // Built after the table, which takes the threads it can show inline.
    this.body.appendChild(this.fileNotes());
    this.body.appendChild(table);
  };

  // Rows for the current threads on a line, each shown once.
  FileView.prototype.threadRows = function (oldNum, newNum) {
    var view = this;
    var rows = this.threads.filter(function (thread, index) {
      if (thread.outdated || thread.line === null || view.placed[index]) return false;
      var here = thread.side === "old" ? thread.line === oldNum : thread.line === newNum;
      if (here) view.placed[index] = true;
      return here;
    }).map(function (thread) {
      return el("tr", { class: "thread-row" }, [el("td", { colspan: "4" }, [renderThread(thread)])]);
    });
    draftsOnFile(this.file).filter(function (draft) {
      return draft.side === "old" ? draft.line === oldNum : draft.line === newNum;
    }).forEach(function (draft) {
      var tr = el("tr", { class: "thread-row" });
      tr.appendChild(el("td", { colspan: "4" }, [view.renderDraft(draft, tr)]));
      rows.push(tr);
    });
    return rows;
  };

  FileView.prototype.renderDraft = function (draft, tr) {
    var view = this;
    var edit = el("button", { type: "button", text: "Edit" });
    var remove = el("button", { type: "button", text: "Delete" });
    edit.addEventListener("click", function () { view.openEditor(tr, draft); });
    remove.addEventListener("click", function () { deleteDraft(draft.id); view.render(); });
    return el("div", { class: "thread pending" }, [
      el("div", { class: "comment-meta" }, [el("span", { class: "pending-label", text: "Pending" }), " ", edit, " ", remove]),
      el("div", { class: "draft-body", text: draft.body }),
    ]);
  };

  // What the diff cannot show inline: comments on the whole file, on lines
  // not shown, and on earlier versions.
  FileView.prototype.fileNotes = function () {
    var view = this;
    var notes = el("div", { class: "file-notes" });
    var unplaced = [];
    var outdated = [];
    this.threads.forEach(function (thread, index) {
      if (thread.outdated) outdated.push(thread);
      else if (!view.placed[index]) unplaced.push(thread);
    });
    unplaced.forEach(function (thread) {
      var where = thread.line === null ? "On this file" : "On line " + thread.line + (thread.side === "old" ? " of the old file" : "") + ", not shown";
      notes.appendChild(el("div", { class: "note-label", text: where }));
      notes.appendChild(renderThread(thread));
    });
    if (outdated.length) {
      var list = el("details", { class: "outdated" }, [
        el("summary", { text: outdated.length + " outdated " + (outdated.length === 1 ? "thread" : "threads") + " on an earlier version" }),
      ]);
      outdated.forEach(function (thread) { list.appendChild(renderThread(thread)); });
      notes.appendChild(list);
    }
    return notes;
  };

  // The file as a list of hunk headers and lines, with revealed context.
  FileView.prototype.rows = function () {
    var view = this;
    var rows = [];
    function contextRows(gap, from, to) {
      for (var number = from; number <= to; number++) {
        rows.push({ kind: " ", oldNum: number + gap.offset, newNum: number });
      }
    }
    this.file.hunks.forEach(function (hunk, index) {
      var gap = view.gaps[index];
      var size = Math.max(0, gap.to - gap.from + 1);
      contextRows(gap, gap.from, gap.from + gap.top - 1);
      rows.push({ header: hunk, gap: gap, gapIndex: index, hidden: size - gap.top - gap.bottom });
      contextRows(gap, gap.to - gap.bottom + 1, gap.to);
      var oldNum = hunk.oldStart;
      var newNum = hunk.newStart;
      hunk.lines.forEach(function (line) {
        rows.push({
          kind: line[0],
          oldNum: line[0] === "+" ? null : oldNum++,
          newNum: line[0] === "-" ? null : newNum++,
          inDiff: true,
        });
      });
    });
    var trailing = this.gaps[this.gaps.length - 1];
    var trailingSize = Math.max(0, trailing.to - trailing.from + 1);
    contextRows(trailing, trailing.from, trailing.from + trailing.top - 1);
    if (trailing.expandable && trailingSize - trailing.top > 0) {
      rows.push({ header: null, gap: trailing, gapIndex: this.gaps.length - 1, hidden: trailingSize - trailing.top });
    }
    return rows;
  };

  FileView.prototype.expand = function (gapIndex, direction) {
    var gap = this.gaps[gapIndex];
    var hidden = Math.max(0, gap.to - gap.from + 1) - gap.top - gap.bottom;
    if (direction === "all") gap.top += hidden;
    else if (direction === "down") gap.top += Math.min(EXPAND_STEP, hidden);
    else gap.bottom += Math.min(EXPAND_STEP, hidden);
    this.render();
  };

  FileView.prototype.headerCell = function (row, colspan) {
    var view = this;
    var cell = el("td", { colspan: String(colspan) });
    var gap = row.gap;
    if (gap.expandable && row.hidden > 0) {
      var isFirst = row.gapIndex === 0;
      var isTrailing = row.header === null;
      var buttons = [];
      if (row.hidden <= EXPAND_STEP) {
        buttons.push(["all", "Show " + row.hidden + (row.hidden === 1 ? " line" : " lines")]);
      } else {
        if (!isFirst) buttons.push(["down", "Expand down"]);
        if (!isTrailing) buttons.push(["up", "Expand up"]);
      }
      buttons.forEach(function (spec) {
        var button = el("button", { type: "button", text: spec[1] });
        button.addEventListener("click", function () { view.expand(row.gapIndex, spec[0]); });
        cell.appendChild(button);
      });
    }
    if (row.header) {
      var hunk = row.header;
      var text = "@@ -" + hunk.oldStart + "," + hunk.oldLines + " +" + hunk.newStart + "," + hunk.newLines + " @@" +
        (hunk.section ? " " + hunk.section : "");
      cell.appendChild(el("span", { text: text }));
    }
    return el("tr", { class: "hunk" }, [cell]);
  };

  function codeCell(html, cls) {
    var cell = el("td", { class: "code " + cls });
    cell.innerHTML = html === undefined ? "" : html;
    return cell;
  }

  function numCell(number, cls) {
    return el("td", { class: "num " + cls, text: number === null || number === undefined ? "" : String(number) });
  }

  // A line-number cell that starts a comment on its side of the line. Only
  // lines inside the diff can carry one: forges refuse the rest.
  FileView.prototype.commentCell = function (cell, row, side, tr) {
    var line = side === "old" ? row.oldNum : row.newNum;
    if (!data.served || !row.inDiff || line === null || line === undefined) return cell;
    var view = this;
    cell.classList.add("commentable");
    cell.title = "Comment on this line";
    cell.addEventListener("click", function () {
      var paired = row.kind === " " ? (side === "old" ? row.newNum : row.oldNum) : null;
      view.openEditor(tr(), { path: view.file.path, oldPath: view.file.oldPath, side: side, line: line, pairedLine: paired, body: "" });
    });
    return cell;
  };

  FileView.prototype.openEditor = function (after, draft) {
    var view = this;
    var existing = after.parentNode.querySelector("tr.editor-row");
    if (existing) existing.remove();
    var text = el("textarea", { rows: "4", placeholder: "Leave a comment" });
    text.value = draft.body;
    var save = el("button", { type: "button", class: "primary", text: draft.id ? "Update comment" : "Add comment" });
    var cancel = el("button", { type: "button", text: "Cancel" });
    var row = el("tr", { class: "editor-row" }, [el("td", { colspan: "4" }, [
      el("div", { class: "editor" }, [text, el("div", { class: "editor-actions" }, [cancel, save])]),
    ])]);
    after.parentNode.insertBefore(row, after.nextSibling);
    text.focus();
    cancel.addEventListener("click", function () { row.remove(); });
    save.addEventListener("click", function () {
      if (!text.value.trim()) return;
      draft.body = text.value;
      saveDraft(draft);
      view.render();
    });
  };

  function lineClass(kind) {
    return kind === "+" ? "add" : kind === "-" ? "del" : "";
  }

  FileView.prototype.unifiedTable = function (rows) {
    var view = this;
    var body = el("tbody");
    rows.forEach(function (row) {
      if ("header" in row) {
        body.appendChild(view.headerCell(row, 4));
        return;
      }
      var cls = lineClass(row.kind);
      var html = row.kind === "-" ? view.sides.old.line(row.oldNum) : view.sides.new.line(row.newNum);
      var tr = el("tr");
      var self = function () { return tr; };
      [
        view.commentCell(numCell(row.oldNum, cls), row, "old", self),
        view.commentCell(numCell(row.newNum, cls), row, "new", self),
        el("td", { class: "sign " + cls, text: row.kind === " " ? "" : row.kind }),
        codeCell(html, cls),
      ].forEach(function (cell) { tr.appendChild(cell); });
      body.appendChild(tr);
      view.threadRows(row.oldNum, row.newNum).forEach(function (tr) { body.appendChild(tr); });
    });
    var cols = el("colgroup", {}, [el("col", { class: "num" }), el("col", { class: "num" }), el("col", { class: "sign" }), el("col")]);
    return el("table", { class: "diff" }, [cols, body]);
  };

  FileView.prototype.splitTable = function (rows) {
    var view = this;
    var body = el("tbody");
    var deleted = [];
    var added = [];
    function flush() {
      for (var index = 0; index < Math.max(deleted.length, added.length); index++) {
        var left = deleted[index];
        var right = added[index];
        var tr = el("tr");
        var self = function () { return tr; };
        [
          left ? view.commentCell(numCell(left.oldNum, "del"), left, "old", self) : numCell(null, "empty"),
          codeCell(left ? view.sides.old.line(left.oldNum) : "", left ? "del" : "empty"),
          right ? view.commentCell(numCell(right.newNum, "add"), right, "new", self) : numCell(null, "empty"),
          codeCell(right ? view.sides.new.line(right.newNum) : "", right ? "add" : "empty"),
        ].forEach(function (cell) { tr.appendChild(cell); });
        body.appendChild(tr);
        view.threadRows(left ? left.oldNum : null, right ? right.newNum : null).forEach(function (tr) { body.appendChild(tr); });
      }
      deleted = [];
      added = [];
    }
    rows.forEach(function (row) {
      if ("header" in row) {
        flush();
        body.appendChild(view.headerCell(row, 4));
      } else if (row.kind === "-") {
        if (added.length) flush();
        deleted.push(row);
      } else if (row.kind === "+") {
        added.push(row);
      } else {
        flush();
        var tr = el("tr");
        var self = function () { return tr; };
        [
          view.commentCell(numCell(row.oldNum, ""), row, "old", self),
          codeCell(view.sides.old.line(row.oldNum), ""),
          view.commentCell(numCell(row.newNum, ""), row, "new", self),
          codeCell(view.sides.new.line(row.newNum), ""),
        ].forEach(function (cell) { tr.appendChild(cell); });
        body.appendChild(tr);
        view.threadRows(row.oldNum, row.newNum).forEach(function (tr) { body.appendChild(tr); });
      }
    });
    flush();
    var cols = el("colgroup", {}, [el("col", { class: "num" }), el("col"), el("col", { class: "num" }), el("col")]);
    return el("table", { class: "diff split" }, [cols, body]);
  };

  function discussion() {
    return chapter.conversation || { verdicts: [], comments: [], threads: [] };
  }

  // Comments waiting to go out with the next review, kept per head so they
  // survive a reload but not new commits.
  function draftsKey() {
    return "git-stk-tour-drafts:" + chapter.headSha;
  }

  function drafts() {
    var stored = readStorage(draftsKey(), []);
    return Array.isArray(stored) ? stored : [];
  }

  function draftsOnFile(file) {
    return drafts().filter(function (draft) { return draft.path === file.path; });
  }

  function saveDraft(draft) {
    var all = drafts();
    if (!draft.id) {
      draft.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      all.push(draft);
    } else {
      all = all.map(function (other) { return other.id === draft.id ? draft : other; });
    }
    writeStorage(draftsKey(), all);
    showDraftCount();
  }

  function deleteDraft(id) {
    writeStorage(draftsKey(), drafts().filter(function (draft) { return draft.id !== id; }));
    showDraftCount();
  }

  function showDraftCount() {
    var badge = document.getElementById("draft-count");
    if (badge) badge.textContent = drafts().length ? String(drafts().length) : "";
  }

  var EVENTS = { comment: "Comment", approve: "Approve", request_changes: "Request changes" };

  function openReview() {
    var existing = document.getElementById("review-panel");
    if (existing) { existing.remove(); return; }
    var pending = drafts();
    var summary = el("textarea", { rows: "4", placeholder: "Summary (optional)" });
    summary.value = readStorage(draftsKey() + ":summary", "");
    summary.addEventListener("input", function () { writeStorage(draftsKey() + ":summary", summary.value); });
    var choices = el("div", { class: "review-events" }, (data.reviewEvents || ["comment"]).map(function (event, index) {
      var input = el("input", { type: "radio", name: "review-event", value: event });
      if (index === 0) input.checked = true;
      return el("label", {}, [input, " " + (EVENTS[event] || event)]);
    }));
    var list = el("ul", { class: "review-comments" }, pending.map(function (draft) {
      return el("li", {}, [el("code", { text: draft.path + ":" + draft.line + (draft.side === "old" ? " (old)" : "") }), " " + draft.body.split("\n")[0].slice(0, 80)]);
    }));
    var status = el("div", { class: "review-status" });
    var submit = el("button", { type: "button", class: "primary", text: "Submit review" });
    var close = el("button", { type: "button", text: "Close" });
    var panel = el("div", { id: "review-panel", class: "review-panel", role: "dialog", "aria-label": "Submit a review" }, [
      el("h2", { text: "Review " + chapter.review.id }),
      summary,
      choices,
      el("div", { class: "note-label", text: pending.length ? pending.length + (pending.length === 1 ? " pending comment" : " pending comments") : "No pending comments; click a line number in the diff to add one." }),
      list,
      el("div", { class: "editor-actions" }, [close, submit]),
      status,
    ]);
    close.addEventListener("click", function () { panel.remove(); });
    submit.addEventListener("click", function () {
      var event = (panel.querySelector("input[name=review-event]:checked") || {}).value || "comment";
      var shown = chapterIndex;
      // The review's own drafts, however the page has moved on by the time
      // the terminal answers.
      var key = draftsKey();
      submit.disabled = true;
      status.className = "review-status";
      status.textContent = "Confirm in your terminal to post this review.";
      fetch("api/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chapter: shown, event: event, body: summary.value, comments: drafts() }),
      }).then(function (response) {
        return response.json().then(function (answer) { return { ok: response.ok, answer: answer }; });
      }).then(function (result) {
        submit.disabled = false;
        if (!result.ok) {
          status.className = "review-status failed";
          status.textContent = result.answer.error || "The review was not posted.";
          return;
        }
        writeStorage(key, []);
        writeStorage(key + ":summary", "");
        status.className = "review-status posted";
        status.textContent = "";
        status.appendChild(document.createTextNode("Posted. "));
        if (result.answer.url) status.appendChild(el("a", { href: result.answer.url, target: "_blank", rel: "noopener", text: "View the review" }));
        showDraftCount();
        var refresh = document.querySelector(".conversation .panel-head button");
        if (refresh) refresh.click();
      }).catch(function () {
        submit.disabled = false;
        status.className = "review-status failed";
        status.textContent = "The tour server did not answer; it may have stopped.";
      });
    });
    document.body.appendChild(panel);
    summary.focus();
  }

  function threadsOnFile(file) {
    return (discussion().threads || []).filter(function (thread) {
      return thread.path === file.path || (thread.side === "old" && thread.path === file.oldPath);
    });
  }

  // Rendered Markdown, with its links opening in a new tab: leaving the page
  // would close the tour.
  function setMarkdown(node, html) {
    node.innerHTML = html || "";
    Array.prototype.forEach.call(node.querySelectorAll("a[href]"), function (link) {
      if (link.getAttribute("href").charAt(0) === "#") return;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
    });
  }

  function when(at) {
    var date = at ? new Date(at) : null;
    return date && !isNaN(date) ? date.toLocaleString() : "";
  }

  // Bodies are rendered from Markdown by git-stk, with raw HTML removed.
  function renderComment(comment) {
    var body = el("div", { class: "markdown comment-body" });
    setMarkdown(body, comment.bodyHtml);
    var meta = el("div", { class: "comment-meta" }, [
      el("strong", { text: comment.author || "unknown" }),
      " ",
      comment.url ? el("a", { href: comment.url, target: "_blank", rel: "noopener", text: when(comment.at) || "link" }) : el("span", { text: when(comment.at) }),
    ]);
    return el("div", { class: "comment" }, [meta, body]);
  }

  // Post to the tour server, which asks in the terminal before posting
  // anything; show progress in `status`, and refresh the discussion after.
  function postAction(path, payload, status, asks) {
    status.className = "action-status";
    status.textContent = asks ? "Confirm in your terminal to post this." : "Saving...";
    payload.chapter = chapterIndex;
    return fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })
      .then(function (response) {
        return response.json().then(function (answer) { return { ok: response.ok, answer: answer }; });
      })
      .then(function (result) {
        if (!result.ok) {
          status.className = "action-status failed";
          status.textContent = result.answer.error || "That did not go through.";
          return false;
        }
        status.textContent = "";
        var refresh = document.querySelector(".conversation .panel-head button");
        if (refresh) refresh.click();
        return true;
      })
      .catch(function () {
        status.className = "action-status failed";
        status.textContent = "The tour server did not answer; it may have stopped.";
        return false;
      });
  }

  function threadTarget(thread) {
    return { id: thread.id, path: thread.path, side: thread.side, line: thread.line, outdated: thread.outdated };
  }

  // Reply and resolve controls for a thread on a served page.
  function threadActions(thread) {
    if (!data.served) return null;
    var status = el("span", { class: "action-status" });
    var actions = el("div", { class: "thread-actions", "data-thread-id": thread.id });
    var reply = el("button", { type: "button", text: "Reply" });
    actions.appendChild(reply);
    if (data.resolvesThreads && thread.resolved !== null) {
      var toggle = el("button", { type: "button", text: thread.resolved ? "Reopen" : "Resolve" });
      toggle.addEventListener("click", function () {
        toggle.disabled = true;
        postAction("api/resolve", { thread: threadTarget(thread), resolved: !thread.resolved }, status, false)
          .then(function () { toggle.disabled = false; });
      });
      actions.appendChild(toggle);
    }
    actions.appendChild(status);
    reply.addEventListener("click", function () {
      if (actions.querySelector("textarea")) return;
      var text = el("textarea", { rows: "3", placeholder: "Reply" });
      var send = el("button", { type: "button", class: "primary", text: "Reply" });
      var cancel = el("button", { type: "button", text: "Cancel" });
      var editor = el("div", { class: "editor" }, [text, el("div", { class: "editor-actions" }, [cancel, send])]);
      actions.parentNode.insertBefore(editor, actions);
      text.focus();
      cancel.addEventListener("click", function () { editor.remove(); });
      send.addEventListener("click", function () {
        if (!text.value.trim()) return;
        send.disabled = true;
        postAction("api/reply", { thread: threadTarget(thread), body: text.value }, status, true)
          .then(function (posted) { if (posted) editor.remove(); else send.disabled = false; });
      });
    });
    return actions;
  }

  function renderThread(thread) {
    var parts = [];
    if (thread.outdated) {
      var where = thread.line === null ? "" : " line " + thread.line;
      parts.push(el("div", { class: "note-label", text: thread.path + where + ", on an earlier version" }));
      if (thread.diffHunk) parts.push(el("pre", { class: "thread-hunk", text: thread.diffHunk }));
    }
    thread.comments.forEach(function (comment) { parts.push(renderComment(comment)); });
    var actions = threadActions(thread);
    if (actions) parts.push(actions);
    if (thread.resolved) {
      var first = thread.comments[0];
      return el("details", { class: "thread resolved" }, [
        el("summary", { text: "Resolved thread" + (first ? " started by " + first.author : "") }),
      ].concat(parts));
    }
    return el("div", { class: "thread" }, parts);
  }

  var VERDICTS = {
    approved: "Approved",
    changes_requested: "Changes requested",
    commented: "Reviewed",
    dismissed: "Dismissed",
  };

  // The review's discussion that is not on a line of this diff: outcomes,
  // comments on the review, and threads on files the diff does not show.
  function renderConversation() {
    var conversation = discussion();
    var panel = el("div", { class: "panel conversation" });
    var heading = el("div", { class: "panel-head" }, [el("h2", { text: "Conversation" })]);
    if (data.served) {
      var refresh = el("button", { type: "button", text: "Refresh" });
      refresh.addEventListener("click", function () { refreshConversation(refresh); });
      heading.appendChild(refresh);
    }
    panel.appendChild(heading);
    if (conversation.error) {
      panel.appendChild(el("div", { class: "note", text: "The discussion could not be loaded: " + conversation.error }));
      return panel;
    }
    var items = (conversation.verdicts || []).map(function (verdict) {
      return { at: verdict.at, node: el("div", { class: "timeline-item" }, [
        el("span", { class: "verdict verdict-" + verdict.state, text: VERDICTS[verdict.state] || verdict.state }),
        renderComment(verdict),
      ]) };
    }).concat((conversation.comments || []).map(function (comment) {
      return { at: comment.at, node: el("div", { class: "timeline-item" }, [renderComment(comment)]) };
    }));
    items.sort(function (a, b) { return (a.at || "").localeCompare(b.at || ""); });
    var paths = {};
    chapter.steps.forEach(function (step) {
      step.files.forEach(function (file) { paths[file.path] = true; if (file.oldPath) paths[file.oldPath] = true; });
    });
    var elsewhere = (conversation.threads || []).filter(function (thread) { return !paths[thread.path]; });
    if (!items.length && !elsewhere.length && !(conversation.threads || []).length) {
      panel.appendChild(el("div", { class: "note", text: "No comments yet." }));
    }
    items.forEach(function (item) { panel.appendChild(item.node); });
    elsewhere.forEach(function (thread) {
      panel.appendChild(el("div", { class: "note-label", text: "On " + thread.path + ", which this diff does not change" }));
      panel.appendChild(renderThread(thread));
    });
    if (conversation.incomplete) {
      panel.appendChild(el("div", { class: "note" }, ["Some of the discussion was left out; ", el("a", { href: chapter.review.url, target: "_blank", rel: "noopener", text: "open the review" }), " to see all of it."]));
    }
    if (data.served) {
      var text = el("textarea", { rows: "3", placeholder: "Comment on this review" });
      var send = el("button", { type: "button", class: "primary", text: "Comment" });
      var status = el("span", { class: "action-status" });
      send.addEventListener("click", function () {
        if (!text.value.trim()) return;
        send.disabled = true;
        postAction("api/comment", { body: text.value }, status, true)
          .then(function (posted) { send.disabled = false; if (posted) text.value = ""; });
      });
      panel.appendChild(el("div", { class: "editor comment-box" }, [text, el("div", { class: "editor-actions" }, [status, send])]));
    }
    return panel;
  }

  // Text typed into the comment box and open reply editors, which a
  // refresh would otherwise throw away with the panel it rebuilds.
  function unsentText() {
    var unsent = { comment: "", replies: {} };
    var box = document.querySelector(".comment-box textarea");
    if (box) unsent.comment = box.value;
    Array.prototype.forEach.call(document.querySelectorAll(".thread-actions[data-thread-id]"), function (actions) {
      var editor = actions.previousElementSibling;
      var text = editor && editor.classList.contains("editor") ? editor.querySelector("textarea") : null;
      if (text && text.value) unsent.replies[actions.getAttribute("data-thread-id")] = text.value;
    });
    return unsent;
  }

  function restoreText(unsent) {
    var box = document.querySelector(".comment-box textarea");
    if (box) box.value = unsent.comment;
    Object.keys(unsent.replies).forEach(function (id) {
      var actions = [].find.call(document.querySelectorAll(".thread-actions[data-thread-id]"), function (candidate) {
        return candidate.getAttribute("data-thread-id") === id;
      });
      if (!actions) return;
      actions.querySelector("button").click();
      var editor = actions.previousElementSibling;
      if (editor) editor.querySelector("textarea").value = unsent.replies[id];
    });
  }

  function refreshConversation(button) {
    button.disabled = true;
    button.textContent = "Refreshing";
    var shown = chapterIndex;
    fetch("api/conversation?chapter=" + shown, { cache: "no-store" })
      .then(function (response) {
        return response.json().then(function (answer) {
          // A failed refresh keeps the discussion already shown.
          if (!response.ok || answer.error) throw new Error(answer.error || "refresh failed");
          return answer;
        });
      })
      .then(function (conversation) {
        data.chapters[shown].conversation = conversation;
        if (chapterIndex === shown) {
          var scroll = window.scrollY;
          var unsent = unsentText();
          renderChapter(shown);
          restoreText(unsent);
          window.scrollTo(0, scroll);
        }
      })
      .catch(function (error) {
        button.disabled = false;
        button.textContent = "Refresh failed; retry";
        button.title = error.message;
      });
  }

  function stepAnchor(stepIndex) {
    return "c" + chapterIndex + "-step-" + stepIndex;
  }

  function reviewedKeyFor(other) {
    return "git-stk-tour:" + other.headSha;
  }

  function renderHeader() {
    var review = chapter.review;
    var additions = 0;
    var deletions = 0;
    var files = 0;
    chapter.steps.forEach(function (step) {
      step.files.forEach(function (file) {
        files++;
        additions += file.additions;
        deletions += file.deletions;
      });
    });
    var stacked = data.chapters.length > 1
      ? el("span", { text: "review " + (chapterIndex + 1) + " of " + data.chapters.length + " in the stack" })
      : null;
    var meta = el("div", { class: "meta" }, [
      el("a", { href: review.url, target: "_blank", rel: "noopener noreferrer", text: review.id }),
      el("span", { class: "state", text: review.state }),
      el("span", {}, [el("code", { text: review.branch }), " into ", el("code", { text: review.base })]),
      stacked,
      el("span", { text: chapter.commits.length + (chapter.commits.length === 1 ? " commit" : " commits") }),
      el("span", {}, [
        files + (files === 1 ? " file " : " files "),
        el("span", { class: "count-add", text: "+" + additions }),
        " ",
        el("span", { class: "count-del", text: "-" + deletions }),
      ]),
    ]);
    var buttons = ["unified", "split"].map(function (name) {
      var button = el("button", { type: "button", "aria-pressed": String(layout === name), text: name === "split" ? "Split" : "Unified" });
      button.addEventListener("click", function () { setLayout(name); });
      return button;
    });
    var toolbar = el("div", { class: "toolbar", id: "toolbar" }, ["View:"].concat(buttons));
    if (data.served) {
      var reviewButton = el("button", { type: "button", class: "review-button" }, ["Review ", el("span", { id: "draft-count", class: "draft-count" })]);
      reviewButton.addEventListener("click", openReview);
      toolbar.appendChild(reviewButton);
    }
    var top = el("div", { class: "header-top" }, [
      navButton(),
      el("h1", { text: review.title || review.id }),
      themeButton(),
    ]);
    return el("header", { id: "c" + chapterIndex }, [top, meta, toolbar]);
  }

  function iconButton(icon, onClick) {
    var button = el("button", { type: "button", class: "icon-button" });
    setIcon(button, icon);
    button.addEventListener("click", onClick);
    return button;
  }

  function setIcon(button, icon) {
    button.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"'
      + ' stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[icon] + "</svg>";
  }

  function navButton() {
    var layoutElement = document.getElementById("layout");
    var button = iconButton("sidebar", function () { showNav(layoutElement.classList.contains("nav-hidden")); });
    button.classList.add("nav-toggle");
    button.setAttribute("aria-controls", "nav");
    function showNav(shown) {
      layoutElement.classList.toggle("nav-hidden", !shown);
      button.setAttribute("aria-expanded", String(shown));
      button.title = shown ? "Hide steps" : "Show steps";
      writeStorage(navKey, !shown);
    }
    showNav(readStorage(navKey, false) !== true);
    return button;
  }

  function currentTheme() {
    return document.documentElement.getAttribute("data-theme")
      || (darkQuery && darkQuery.matches ? "dark" : "light");
  }

  function themeButton() {
    var button = iconButton("moon", function () {
      var theme = currentTheme() === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", theme);
      writeStorage(themeKey, theme);
      showTheme();
    });
    button.id = "theme-button";
    showTheme(button);
    return button;
  }

  function showTheme(button) {
    button = button || document.getElementById("theme-button");
    if (!button) return;
    var dark = currentTheme() === "dark";
    setIcon(button, dark ? "sun" : "moon");
    button.title = dark ? "Switch to light theme" : "Switch to dark theme";
    button.setAttribute("aria-label", button.title);
  }

  function setLayout(name) {
    layout = name;
    writeStorage(layoutKey, name);
    Array.prototype.forEach.call(document.querySelectorAll("#toolbar button"), function (button) {
      button.setAttribute("aria-pressed", String(button.textContent.toLowerCase() === name));
    });
    views.forEach(function (view) {
      if (view.rendered) view.render();
    });
  }

  function renderIntro() {
    var panels = [];
    if (chapter.review.bodyHtml) {
      // Rendered from Markdown by git-stk with raw HTML and script links removed.
      var body = el("div", { class: "markdown" });
      setMarkdown(body, chapter.review.bodyHtml);
      panels.push(el("div", { class: "panel" }, [el("h2", { text: "Description" }), body]));
    }
    if (chapter.commits.length) {
      panels.push(el("div", { class: "panel" }, [
        el("h2", { text: "Commits" }),
        el("ol", { class: "commits" }, chapter.commits.map(function (commit) {
          return el("li", {}, [el("code", { text: commit.sha }), commit.subject]);
        })),
      ]));
    }
    panels.push(renderConversation());
    return el("div", { class: "intro" }, panels);
  }

  function renderNav() {
    var nav = document.getElementById("nav");
    nav.textContent = "";
    if (data.chapters.length > 1) renderStackNav(nav);
    nav.appendChild(el("h2", { text: "Tour" }));
    nav.appendChild(el("div", { class: "progress", id: "progress" }));
    nav.appendChild(el("ol", {}, chapter.steps.map(function (step, stepIndex) {
      var title = (stepIndex + 1) + ". " + step.title;
      var row = el("div", { class: "step-row" }, [
        reviewedBox(step, "Mark " + title + " reviewed"),
        el("a", { class: "step-link", "data-step-link": step.id, href: "#" + stepAnchor(stepIndex), text: title }),
      ]);
      var files = el("div", { class: "step-files" }, step.files.map(function (file, fileIndex) {
        return el("a", { href: "#" + stepAnchor(stepIndex) + "-file-" + fileIndex, title: file.path, text: file.path });
      }));
      return el("li", { class: "step" }, [row, files]);
    })));
    showProgress();
  }

  // The stack as `git stk list` shows it: the top review first, down to the
  // branch the stack lands on.
  function renderStackNav(nav) {
    nav.appendChild(el("h2", { text: "Stack" }));
    var items = data.chapters.map(function (other, index) {
      var link = el("a", { class: "chapter-link", href: "#c" + index, title: other.review.title || other.review.id }, [
        el("span", { class: "chapter-id", text: other.review.id }),
        " ",
        other.review.title || other.review.branch,
      ]);
      if (index === chapterIndex) link.setAttribute("aria-current", "page");
      return el("li", { class: "chapter" }, [link, el("span", { class: "chapter-progress", "data-chapter": index })]);
    }).reverse();
    nav.appendChild(el("ol", { class: "chapters" }, items));
    nav.appendChild(el("div", { class: "chapters-base" }, [el("code", { text: data.chapters[0].review.base })]));
  }

  function showProgress() {
    var done = chapter.steps.filter(function (step) { return reviewed[step.id]; }).length;
    document.getElementById("progress").textContent = done + " of " + chapter.steps.length + " steps reviewed";
    chapter.steps.forEach(function (step) {
      var link = document.querySelector('[data-step-link="' + step.id + '"]');
      if (link) link.classList.toggle("done", !!reviewed[step.id]);
    });
    data.chapters.forEach(function (other, index) {
      var progress = document.querySelector('[data-chapter="' + index + '"]');
      if (!progress) return;
      var marks = index === chapterIndex ? reviewed : readStorage(reviewedKeyFor(other), {});
      var count = other.steps.filter(function (step) { return marks[step.id]; }).length;
      progress.textContent = count + "/" + other.steps.length;
      progress.classList.toggle("done", count === other.steps.length);
    });
  }

  // A checkbox bound to a step's reviewed state; the sidebar and the step's
  // own heading each have one, kept in agreement.
  function reviewedBox(step, label) {
    var box = el("input", { type: "checkbox", "data-step": step.id });
    if (label) box.setAttribute("aria-label", label);
    box.checked = !!reviewed[step.id];
    box.addEventListener("change", function () {
      if (box.checked) reviewed[step.id] = true;
      else delete reviewed[step.id];
      writeStorage(reviewedKey, reviewed);
      Array.prototype.forEach.call(document.querySelectorAll('input[data-step="' + step.id + '"]'), function (other) {
        other.checked = box.checked;
      });
      showProgress();
    });
    return box;
  }

  function renderStep(step, stepIndex) {
    var box = reviewedBox(step, null);
    var head = el("div", { class: "step-head" }, [
      el("h2", { text: (stepIndex + 1) + ". " + step.title }),
      el("label", {}, [box, " Reviewed"]),
    ]);
    var files = step.files.map(function (file, fileIndex) {
      var view = new FileView(file, stepIndex, fileIndex, step.collapsed);
      views.push(view);
      return view.details;
    });
    var next = stepIndex + 1 < chapter.steps.length
      ? el("a", { class: "next", href: "#" + stepAnchor(stepIndex + 1), text: "Next: " + chapter.steps[stepIndex + 1].title })
      : null;
    return el("section", { class: "step", id: stepAnchor(stepIndex) }, [head].concat(files, [next]));
  }

  function renderChapterNav() {
    function link(index, label) {
      var other = data.chapters[index];
      if (!other) return el("span");
      return el("a", { href: "#c" + index }, [label + ": ", el("strong", { text: other.review.id }), " " + (other.review.title || other.review.branch)]);
    }
    if (data.chapters.length < 2) return null;
    return el("div", { class: "chapter-nav", role: "navigation", "aria-label": "Stack" }, [
      link(chapterIndex - 1, "Previous review"),
      link(chapterIndex + 1, "Next review"),
    ]);
  }

  // A file's diff is built the first time it is open and near the viewport,
  // so a large review opens quickly.
  function renderLazily() {
    if (!("IntersectionObserver" in window)) {
      views.forEach(function (view) { if (view.details.open) view.render(); });
      return;
    }
    var byElement = new Map(views.map(function (view) { return [view.details, view]; }));
    observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        var view = byElement.get(entry.target);
        view.visible = entry.isIntersecting;
        if (view.visible && view.details.open && !view.rendered) view.render();
      });
    }, { rootMargin: "800px 0px" });
    views.forEach(function (view) { observer.observe(view.details); });
  }

  var main = document.getElementById("main");

  function renderChapter(index) {
    chapterIndex = index;
    chapter = data.chapters[index];
    reviewedKey = reviewedKeyFor(chapter);
    reviewed = readStorage(reviewedKey, {});
    if (observer) observer.disconnect();
    views = [];
    main.textContent = "";
    var header = renderHeader();
    main.appendChild(header);
    trackHeaderHeight(header);
    main.appendChild(renderIntro());
    chapter.steps.forEach(function (step, stepIndex) {
      main.appendChild(renderStep(step, stepIndex));
    });
    var chapterNav = renderChapterNav();
    if (chapterNav) main.appendChild(chapterNav);
    renderNav();
    renderLazily();
    showDraftCount();
    var stale = document.getElementById("review-panel");
    if (stale) stale.remove();
    var review = chapter.review;
    document.title = "Tour of " + (review.title ? review.title + " (" + review.id + ")" : review.id);
  }

  // The pinned header's height, so file headers stick below it and links
  // land clear of it.
  var headerObserver = null;
  function trackHeaderHeight(header) {
    function measure() {
      document.documentElement.style.setProperty("--header-height", header.offsetHeight + "px");
    }
    if (headerObserver) headerObserver.disconnect();
    if ("ResizeObserver" in window) {
      headerObserver = new ResizeObserver(measure);
      headerObserver.observe(header);
    }
    measure();
  }

  // The review a link points into: "#c2" or "#c2-step-0-file-1".
  function chapterOf(hash) {
    var match = /^#c(\d+)(-|$)/.exec(hash);
    var index = match ? Number(match[1]) : -1;
    return index < data.chapters.length ? index : -1;
  }

  // Show the target of the current link, switching reviews first if it is in
  // another one, and opening the file it names if that file is collapsed.
  function follow() {
    var index = chapterOf(location.hash);
    var switched = index >= 0 && index !== chapterIndex;
    if (switched) renderChapter(index);
    var target = location.hash ? document.getElementById(location.hash.slice(1)) : null;
    if (target && target.tagName === "DETAILS") target.open = true;
    if (switched) {
      if (target) target.scrollIntoView();
      else window.scrollTo(0, 0);
    }
  }

  // While the page is open, the tour server stays up; it stops once the last
  // tab closes or stops checking in.
  if (data.served) {
    var tab = JSON.stringify(Math.random().toString(36).slice(2) + Date.now().toString(36));
    var beat = function () {
      fetch("api/alive", { method: "POST", headers: { "Content-Type": "application/json" }, body: tab })
        .catch(function () {});
    };
    beat();
    setInterval(beat, 5000);
    // A hidden tab's timers are slowed; check in as soon as it shows again.
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") beat();
    });
    window.addEventListener("pagehide", function () {
      fetch("api/closed", { method: "POST", headers: { "Content-Type": "application/json" }, body: tab, keepalive: true })
        .catch(function () {});
    });
  }

  if (darkQuery && darkQuery.addEventListener) darkQuery.addEventListener("change", function () { showTheme(); });
  window.addEventListener("hashchange", follow);
  var start = chapterOf(location.hash);
  renderChapter(start >= 0 ? start : data.current);
  if (location.hash) {
    var initial = document.getElementById(location.hash.slice(1));
    if (initial) {
      if (initial.tagName === "DETAILS") initial.open = true;
      initial.scrollIntoView();
    }
  }
})();
</script>
</body>
</html>
