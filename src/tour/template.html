<html lang="en">
<head>

<title><!--TOUR_TITLE--></title>
<script>
try {
  var theme = JSON.parse(localStorage.getItem("git-stk-tour:theme"));
  if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
} catch (error) {}
</script>
<style>
:root {
  --bg: #ffffff;
  --bg-soft: #f6f8fa;
  --fg: #1f2328;
  --fg-muted: #656d76;
  --border: #d0d7de;
  --accent: #0969da;
  --add-bg: #e6ffec;
  --add-num: #ccffd8;
  --del-bg: #ffebe9;
  --del-num: #ffd7d5;
  --hunk-bg: #ddf4ff;
  --empty-bg: #f6f8fa;
  --done: #1a7f37;
  --removed: #cf222e;
  --hl-keyword: #cf222e;
  --hl-string: #0a3069;
  --hl-comment: #6e7781;
  --hl-title: #8250df;
  --hl-constant: #0550ae;
  --hl-type: #953800;
  --hl-tag: #116329;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117;
    --bg-soft: #161b22;
    --fg: #e6edf3;
    --fg-muted: #8d96a0;
    --border: #30363d;
    --accent: #4493f8;
    --add-bg: #12261e;
    --add-num: #1b4721;
    --del-bg: #25171c;
    --del-num: #542426;
    --hunk-bg: #121d2f;
    --empty-bg: #161b22;
    --done: #3fb950;
    --removed: #f85149;
    --hl-keyword: #ff7b72;
    --hl-string: #a5d6ff;
    --hl-comment: #8b949e;
    --hl-title: #d2a8ff;
    --hl-constant: #79c0ff;
    --hl-type: #ffa657;
    --hl-tag: #7ee787;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1117;
  --bg-soft: #161b22;
  --fg: #e6edf3;
  --fg-muted: #8d96a0;
  --border: #30363d;
  --accent: #4493f8;
  --add-bg: #12261e;
  --add-num: #1b4721;
  --del-bg: #25171c;
  --del-num: #542426;
  --hunk-bg: #121d2f;
  --empty-bg: #161b22;
  --done: #3fb950;
  --removed: #f85149;
  --hl-keyword: #ff7b72;
  --hl-string: #a5d6ff;
  --hl-comment: #8b949e;
  --hl-title: #d2a8ff;
  --hl-constant: #79c0ff;
  --hl-type: #ffa657;
  --hl-tag: #7ee787;
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
html { scroll-padding-top: 16px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}
a { color: var(--accent); }
code, pre, .diff { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
button {
  font: inherit; font-size: 12px; color: var(--fg); background: var(--bg);
  border: 1px solid var(--border); border-radius: 6px; padding: 2px 10px; cursor: pointer;
}
button:hover { border-color: var(--accent); }
button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #ffffff; }
.layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 100vh; }
.layout.nav-hidden { grid-template-columns: minmax(0, 1fr); }
.layout.nav-hidden nav { display: none; }
nav {
  position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto;
  border-right: 1px solid var(--border); background: var(--bg-soft); padding: 16px;
}
nav h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--fg-muted); margin: 0 0 8px; }
nav ol { list-style: none; margin: 0; padding: 0; }
nav li.step { margin-bottom: 12px; }
nav .step-row { display: flex; align-items: center; gap: 6px; }
nav .step-row input { margin: 0; }
nav .step-link { font-weight: 600; color: var(--fg); text-decoration: none; }
nav .step-link.done { color: var(--done); }
nav .step-files { margin: 4px 0 0 20px; }
nav .step-files a { display: block; color: var(--fg-muted); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
nav .step-files a:hover, nav .step-link:hover { text-decoration: underline; }
nav .progress { margin-bottom: 16px; color: var(--fg-muted); }
nav .chapters { margin-bottom: 4px; }
nav .chapter { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
nav .chapter-link {
  flex: 1; min-width: 0; color: var(--fg); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  border-left: 2px solid var(--border); padding: 2px 0 2px 8px;
}
nav .chapter-link:hover { text-decoration: underline; }
nav .chapter-link[aria-current="page"] { border-left-color: var(--accent); font-weight: 600; }
nav .chapter-id { color: var(--fg-muted); }
nav .chapter-progress { color: var(--fg-muted); font-size: 12px; }
nav .chapter-progress.done { color: var(--done); }
nav .chapters-base { color: var(--fg-muted); font-size: 12px; margin: 0 0 20px 10px; }
main { padding: 24px 32px 64px; min-width: 0; }
.header-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 4px; }
header h1 { font-size: 24px; margin: 0; overflow-wrap: anywhere; flex: 1; }
.icon-button { padding: 5px; line-height: 0; color: var(--fg-muted); }
.icon-button:hover { color: var(--fg); }
.meta { color: var(--fg-muted); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.state { border: 1px solid var(--border); border-radius: 999px; padding: 0 8px; font-size: 12px; }
.toolbar { display: flex; gap: 6px; align-items: center; margin-top: 12px; color: var(--fg-muted); }
.intro { margin: 16px 0 32px; display: grid; gap: 16px; }
.panel { border: 1px solid var(--border); border-radius: 6px; padding: 12px 16px; background: var(--bg-soft); }
.panel h2 { font-size: 14px; margin: 0 0 8px; }
.markdown { overflow-wrap: anywhere; }
.markdown > :first-child { margin-top: 0; }
.markdown > :last-child { margin-bottom: 0; }
.markdown h1, .markdown h2, .markdown h3, .markdown h4 { margin: 16px 0 8px; line-height: 1.25; }
.markdown h1 { font-size: 20px; }
.markdown h2 { font-size: 17px; }
.markdown h3, .markdown h4 { font-size: 15px; }
.markdown p, .markdown ul, .markdown ol, .markdown blockquote, .markdown pre, .markdown table { margin: 0 0 12px; }
.markdown ul, .markdown ol { padding-left: 24px; }
.markdown li:has(> input[type="checkbox"]) { list-style: none; margin-left: -20px; }
.markdown code { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
.markdown pre { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; overflow-x: auto; }
.markdown pre code { border: 0; padding: 0; background: none; }
.markdown blockquote { border-left: 3px solid var(--border); padding-left: 12px; color: var(--fg-muted); }
.markdown table { border-collapse: collapse; display: block; overflow-x: auto; }
.markdown th, .markdown td { border: 1px solid var(--border); padding: 4px 10px; }
.markdown hr { border: 0; border-top: 1px solid var(--border); }
.commits { list-style: none; margin: 0; padding: 0; }
.commits code { color: var(--fg-muted); margin-right: 8px; }
section.step { margin-bottom: 40px; }
.step-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 16px; }
.step-head h2 { font-size: 18px; margin: 0; }
.step-head label { color: var(--fg-muted); white-space: nowrap; cursor: pointer; }
.file { border: 1px solid var(--border); border-radius: 6px; margin-bottom: 16px; }
.file > summary {
  list-style: none; cursor: pointer; display: flex; gap: 8px; align-items: center;
  padding: 8px 12px; background: var(--bg-soft); position: sticky; top: 0; z-index: 1;
  border-radius: 6px;
}
.file[open] > summary { border-bottom: 1px solid var(--border); border-radius: 6px 6px 0 0; }
.file > summary::-webkit-details-marker { display: none; }
.file > summary::before { content: ">"; color: var(--fg-muted); font-family: ui-monospace, monospace; transition: transform .1s; }
.file[open] > summary::before { transform: rotate(90deg); }
.file-path { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; overflow-wrap: anywhere; flex: 1; }
.file-status { font-size: 12px; color: var(--fg-muted); }
.count-add { color: var(--done); font-size: 12px; }
.count-del { color: var(--removed); font-size: 12px; }
table.diff { border-collapse: collapse; width: 100%; table-layout: fixed; }
.diff td { padding: 0 8px; vertical-align: top; line-height: 20px; }
.diff td.code { white-space: pre-wrap; overflow-wrap: anywhere; }
.diff col.num { width: 56px; }
.diff col.sign { width: 20px; }
.diff td.num { text-align: right; color: var(--fg-muted); user-select: none; }
.diff td.sign { padding: 0 0 0 6px; user-select: none; }
.diff td.add { background: var(--add-bg); }
.diff td.num.add { background: var(--add-num); }
.diff td.del { background: var(--del-bg); }
.diff td.num.del { background: var(--del-num); }
.diff td.empty { background: var(--empty-bg); }
.diff tr.hunk td { background: var(--hunk-bg); color: var(--fg-muted); padding: 4px 8px; }
.diff tr.hunk button { margin-right: 6px; }
.diff tr.hunk span { white-space: pre-wrap; overflow-wrap: anywhere; }
.note { padding: 12px; color: var(--fg-muted); }
.next { display: inline-block; margin-top: 4px; }
.chapter-nav { display: flex; justify-content: space-between; gap: 16px; border-top: 1px solid var(--border); padding-top: 16px; }
.chapter-nav a { color: var(--accent); text-decoration: none; }
.chapter-nav a:last-child { text-align: right; }
.chapter-nav a:hover { text-decoration: underline; }
.hljs-keyword, .hljs-meta .hljs-keyword, .hljs-template-tag, .hljs-type.hljs-keyword, .hljs-variable.language_ { color: var(--hl-keyword); }
.hljs-string, .hljs-regexp, .hljs-meta .hljs-string, .hljs-char.escape_ { color: var(--hl-string); }
.hljs-comment, .hljs-code, .hljs-formula, .hljs-quote { color: var(--hl-comment); }
.hljs-title, .hljs-title.function_, .hljs-title.class_, .hljs-section, .hljs-doctag { color: var(--hl-title); }
.hljs-number, .hljs-literal, .hljs-attr, .hljs-attribute, .hljs-variable, .hljs-template-variable, .hljs-meta, .hljs-property, .hljs-operator, .hljs-selector-attr, .hljs-selector-class, .hljs-selector-id { color: var(--hl-constant); }
.hljs-built_in, .hljs-type, .hljs-params, .hljs-symbol, .hljs-subst, .hljs-bullet { color: var(--hl-type); }
.hljs-name, .hljs-tag, .hljs-selector-tag, .hljs-selector-pseudo { color: var(--hl-tag); }
.hljs-emphasis { font-style: italic; }
.hljs-strong, .hljs-section { font-weight: 600; }
.hljs-link { text-decoration: underline; }
@media (max-width: 800px) {
  .layout { display: block; }
  nav { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--border); }
  main { padding: 16px; }
  .diff col.num { width: 40px; }
}
</style>
</head>

<script>/*HIGHLIGHT_JS*/</script>
<script id="tour-data" type="application/json">/*TOUR_DATA*/null</script>
<script>
(function () {
  "use strict";
  var data = JSON.parse(document.getElementById("tour-data").textContent);
  var EXPAND_STEP = 20;
  var layoutKey = "git-stk-tour:layout";
  var themeKey = "git-stk-tour:theme";
  var navKey = "git-stk-tour:nav-hidden";
  var darkQuery = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  var ICONS = {
    sidebar: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>',
    moon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
  };
  var layout = readStorage(layoutKey, "unified") === "split" ? "split" : "unified";
  // One review of the stack is shown at a time.
  var chapterIndex = 0;
  var chapter = null;
  var reviewedKey = "";
  var reviewed = {};
  var views = [];
  var observer = null;

  function readStorage(key, fallback) {
    try {
      var value = JSON.parse(localStorage.getItem(key));
      return value === null ? fallback : value;
    } catch (error) {
      return fallback;
    }
  }

  function writeStorage(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (error) {
      // Storage can be unavailable for file:// pages; the choice just isn't kept.
    }
  }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (key) {
      if (key === "text") node.textContent = attrs[key];
      else if (key === "class") node.className = attrs[key];
      else node.setAttribute(key, attrs[key]);
    });
    (children || []).forEach(function (child) {
      if (child) node.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
    });
    return node;
  }

  function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function highlight(text, language) {
    if (language && window.hljs && hljs.getLanguage(language)) {
      try {
        return hljs.highlight(text, { language: language, ignoreIllegals: true }).value;
      } catch (error) {
        // Fall through to plain text.
      }
    }
    return escapeHtml(text);
  }

  // Split highlighted HTML into lines, closing the spans still open at each
  // line break and reopening them on the next line, so every line stands on
  // its own while multi-line strings and comments keep their color.
  function splitHighlighted(html) {
    var lines = [];
    var open = [];
    var current = "";
    var token = /(<span[^>]*>)|(<\/span>)|(\n)|([^<\n]+)/g;
    var match;
    while ((match = token.exec(html))) {
      if (match[1]) {
        open.push(match[1]);
        current += match[1];
      } else if (match[2]) {
        open.pop();
        current += match[2];
      } else if (match[3]) {
        lines.push(current + "</span>".repeat(open.length));
        current = open.join("");
      } else {
        current += match[4];
      }
    }
    lines.push(current + "</span>".repeat(open.length));
    return lines;
  }

  function textLines(text) {
    if (text === "") return [];
    var lines = text.replace(/\r\n/g, "\n").split("\n");
    if (lines.length > 1 && lines[lines.length - 1] === "") lines.pop();
    return lines;
  }

  function firstNew(hunk) { return hunk.newLines === 0 ? hunk.newStart + 1 : hunk.newStart; }
  function firstOld(hunk) { return hunk.oldLines === 0 ? hunk.oldStart + 1 : hunk.oldStart; }

  // One side's highlighted lines by line number. With the whole file
  // embedded, it is highlighted in full; otherwise only the diff's own lines
  // of that side are, which can misread a hunk that starts mid-comment.
  function buildSide(file, side) {
    var text = side === "old" ? file.oldText : file.newText;
    var skip = side === "old" ? "+" : "-";
    var numbered = [];
    file.hunks.forEach(function (hunk) {
      var number = side === "old" ? hunk.oldStart : hunk.newStart;
      hunk.lines.forEach(function (line) {
        if (line[0] === skip) return;
        numbered.push([number++, line[1]]);
      });
    });

    if (typeof text === "string") {
      var lines = textLines(text);
      var matches = numbered.every(function (pair) { return lines[pair[0] - 1] === pair[1]; });
      if (matches) {
        var html = splitHighlighted(highlight(lines.join("\n"), file.language));
        return { full: true, count: lines.length, line: function (number) { return html[number - 1]; } };
      }
    }
    var partial = splitHighlighted(highlight(numbered.map(function (pair) { return pair[1]; }).join("\n"), file.language));
    var byNumber = {};
    numbered.forEach(function (pair, index) { byNumber[pair[0]] = partial[index]; });
    return { full: false, count: 0, line: function (number) { return byNumber[number]; } };
  }

  function FileView(file, stepIndex, fileIndex, collapsed) {
    this.file = file;
    this.anchor = stepAnchor(stepIndex) + "-file-" + fileIndex;
    this.sides = null;
    this.gaps = null;
    this.rendered = false;
    this.visible = !("IntersectionObserver" in window);
    this.details = this.build(collapsed);
  }

  FileView.prototype.build = function (collapsed) {
    var file = this.file;
    var label = file.status === "renamed" || file.status === "copied"
      ? file.oldPath + " -> " + file.path
      : file.path;
    var summary = el("summary", {}, [
      el("span", { class: "file-path", text: label }),
      file.status !== "modified" ? el("span", { class: "file-status", text: file.status }) : null,
      el("span", { class: "count-add", text: "+" + file.additions }),
      el("span", { class: "count-del", text: "-" + file.deletions }),
    ]);
    this.body = el("div");
    var details = el("details", { class: "file", id: this.anchor }, [summary, this.body]);
    details.open = !collapsed;
    var view = this;
    details.addEventListener("toggle", function () {
      if (details.open && view.visible && !view.rendered) view.render();
    });
    return details;
  };

  // The unchanged stretches before each hunk and after the last, in new-file
  // line numbers, each with how much of it has been revealed from either end.
  FileView.prototype.buildGaps = function () {
    var hunks = this.file.hunks;
    var expandable = this.sides.old.full && this.sides.new.full;
    var gaps = hunks.map(function (hunk, index) {
      var previous = hunks[index - 1];
      var from = previous ? firstNew(previous) + previous.newLines : 1;
      return { from: from, to: firstNew(hunk) - 1, offset: firstOld(hunk) - firstNew(hunk), top: 0, bottom: 0 };
    });
    var last = hunks[hunks.length - 1];
    var end = firstNew(last) + last.newLines;
    gaps.push({
      from: end,
      to: expandable ? this.sides.new.count : end - 1,
      offset: firstOld(last) + last.oldLines - end,
      top: 0,
      bottom: 0,
    });
    gaps.forEach(function (gap) { gap.expandable = expandable; });
    return gaps;
  };

  FileView.prototype.render = function () {
    var file = this.file;
    this.rendered = true;
    this.body.textContent = "";
    if (file.binary) {
      this.body.appendChild(el("div", { class: "note", text: "Binary file not shown." }));
      return;
    }
    if (!file.hunks.length) {
      var reason = file.status === "renamed" ? "Renamed without changes." : "No content changes.";
      this.body.appendChild(el("div", { class: "note", text: reason }));
      return;
    }
    if (!this.sides) {
      this.sides = { old: buildSide(file, "old"), new: buildSide(file, "new") };
      this.gaps = this.buildGaps();
    }
    var rows = this.rows();
    this.body.appendChild(layout === "split" ? this.splitTable(rows) : this.unifiedTable(rows));
  };

  // The file as a list of hunk headers and lines, with revealed context.
  FileView.prototype.rows = function () {
    var view = this;
    var rows = [];
    function contextRows(gap, from, to) {
      for (var number = from; number <= to; number++) {
        rows.push({ kind: " ", oldNum: number + gap.offset, newNum: number });
      }
    }
    this.file.hunks.forEach(function (hunk, index) {
      var gap = view.gaps[index];
      var size = Math.max(0, gap.to - gap.from + 1);
      contextRows(gap, gap.from, gap.from + gap.top - 1);
      rows.push({ header: hunk, gap: gap, gapIndex: index, hidden: size - gap.top - gap.bottom });
      contextRows(gap, gap.to - gap.bottom + 1, gap.to);
      var oldNum = hunk.oldStart;
      var newNum = hunk.newStart;
      hunk.lines.forEach(function (line) {
        rows.push({
          kind: line[0],
          oldNum: line[0] === "+" ? null : oldNum++,
          newNum: line[0] === "-" ? null : newNum++,
        });
      });
    });
    var trailing = this.gaps[this.gaps.length - 1];
    var trailingSize = Math.max(0, trailing.to - trailing.from + 1);
    contextRows(trailing, trailing.from, trailing.from + trailing.top - 1);
    if (trailing.expandable && trailingSize - trailing.top > 0) {
      rows.push({ header: null, gap: trailing, gapIndex: this.gaps.length - 1, hidden: trailingSize - trailing.top });
    }
    return rows;
  };

  FileView.prototype.expand = function (gapIndex, direction) {
    var gap = this.gaps[gapIndex];
    var hidden = Math.max(0, gap.to - gap.from + 1) - gap.top - gap.bottom;
    if (direction === "all") gap.top += hidden;
    else if (direction === "down") gap.top += Math.min(EXPAND_STEP, hidden);
    else gap.bottom += Math.min(EXPAND_STEP, hidden);
    this.render();
  };

  FileView.prototype.headerCell = function (row, colspan) {
    var view = this;
    var cell = el("td", { colspan: String(colspan) });
    var gap = row.gap;
    if (gap.expandable && row.hidden > 0) {
      var isFirst = row.gapIndex === 0;
      var isTrailing = row.header === null;
      var buttons = [];
      if (row.hidden <= EXPAND_STEP) {
        buttons.push(["all", "Show " + row.hidden + (row.hidden === 1 ? " line" : " lines")]);
      } else {
        if (!isFirst) buttons.push(["down", "Expand down"]);
        if (!isTrailing) buttons.push(["up", "Expand up"]);
      }
      buttons.forEach(function (spec) {
        var button = el("button", { type: "button", text: spec[1] });
        button.addEventListener("click", function () { view.expand(row.gapIndex, spec[0]); });
        cell.appendChild(button);
      });
    }
    if (row.header) {
      var hunk = row.header;
      var text = "@@ -" + hunk.oldStart + "," + hunk.oldLines + " +" + hunk.newStart + "," + hunk.newLines + " @@" +
        (hunk.section ? " " + hunk.section : "");
      cell.appendChild(el("span", { text: text }));
    }
    return el("tr", { class: "hunk" }, [cell]);
  };

  function codeCell(html, cls) {
    var cell = el("td", { class: "code " + cls });
    cell.innerHTML = html === undefined ? "" : html;
    return cell;
  }

  function numCell(number, cls) {
    return el("td", { class: "num " + cls, text: number === null || number === undefined ? "" : String(number) });
  }

  function lineClass(kind) {
    return kind === "+" ? "add" : kind === "-" ? "del" : "";
  }

  FileView.prototype.unifiedTable = function (rows) {
    var view = this;
    var body = el("tbody");
    rows.forEach(function (row) {
      if ("header" in row) {
        body.appendChild(view.headerCell(row, 4));
        return;
      }
      var cls = lineClass(row.kind);
      var html = row.kind === "-" ? view.sides.old.line(row.oldNum) : view.sides.new.line(row.newNum);
      body.appendChild(el("tr", {}, [
        numCell(row.oldNum, cls),
        numCell(row.newNum, cls),
        el("td", { class: "sign " + cls, text: row.kind === " " ? "" : row.kind }),
        codeCell(html, cls),
      ]));
    });
    var cols = el("colgroup", {}, [el("col", { class: "num" }), el("col", { class: "num" }), el("col", { class: "sign" }), el("col")]);
    return el("table", { class: "diff" }, [cols, body]);
  };

  FileView.prototype.splitTable = function (rows) {
    var view = this;
    var body = el("tbody");
    var deleted = [];
    var added = [];
    function flush() {
      for (var index = 0; index < Math.max(deleted.length, added.length); index++) {
        var left = deleted[index];
        var right = added[index];
        body.appendChild(el("tr", {}, [
          numCell(left ? left.oldNum : null, left ? "del" : "empty"),
          codeCell(left ? view.sides.old.line(left.oldNum) : "", left ? "del" : "empty"),
          numCell(right ? right.newNum : null, right ? "add" : "empty"),
          codeCell(right ? view.sides.new.line(right.newNum) : "", right ? "add" : "empty"),
        ]));
      }
      deleted = [];
      added = [];
    }
    rows.forEach(function (row) {
      if ("header" in row) {
        flush();
        body.appendChild(view.headerCell(row, 4));
      } else if (row.kind === "-") {
        if (added.length) flush();
        deleted.push(row);
      } else if (row.kind === "+") {
        added.push(row);
      } else {
        flush();
        body.appendChild(el("tr", {}, [
          numCell(row.oldNum, ""),
          codeCell(view.sides.old.line(row.oldNum), ""),
          numCell(row.newNum, ""),
          codeCell(view.sides.new.line(row.newNum), ""),
        ]));
      }
    });
    flush();
    var cols = el("colgroup", {}, [el("col", { class: "num" }), el("col"), el("col", { class: "num" }), el("col")]);
    return el("table", { class: "diff split" }, [cols, body]);
  };

  function stepAnchor(stepIndex) {
    return "c" + chapterIndex + "-step-" + stepIndex;
  }

  function reviewedKeyFor(other) {
    return "git-stk-tour:" + other.headSha;
  }

  function renderHeader() {
    var review = chapter.review;
    var additions = 0;
    var deletions = 0;
    var files = 0;
    chapter.steps.forEach(function (step) {
      step.files.forEach(function (file) {
        files++;
        additions += file.additions;
        deletions += file.deletions;
      });
    });
    var stacked = data.chapters.length > 1
      ? el("span", { text: "review " + (chapterIndex + 1) + " of " + data.chapters.length + " in the stack" })
      : null;
    var meta = el("div", { class: "meta" }, [
      el("a", { href: review.url, text: review.id }),
      el("span", { class: "state", text: review.state }),
      el("span", {}, [el("code", { text: review.branch }), " into ", el("code", { text: review.base })]),
      stacked,
      el("span", { text: chapter.commits.length + (chapter.commits.length === 1 ? " commit" : " commits") }),
      el("span", {}, [
        files + (files === 1 ? " file " : " files "),
        el("span", { class: "count-add", text: "+" + additions }),
        " ",
        el("span", { class: "count-del", text: "-" + deletions }),
      ]),
    ]);
    var buttons = ["unified", "split"].map(function (name) {
      var button = el("button", { type: "button", "aria-pressed": String(layout === name), text: name === "split" ? "Split" : "Unified" });
      button.addEventListener("click", function () { setLayout(name); });
      return button;
    });
    var toolbar = el("div", { class: "toolbar", id: "toolbar" }, ["View:"].concat(buttons));
    var top = el("div", { class: "header-top" }, [
      navButton(),
      el("h1", { text: review.title || review.id }),
      themeButton(),
    ]);
    return el("header", { id: "c" + chapterIndex }, [top, meta, toolbar]);
  }

  function iconButton(icon, onClick) {
    var button = el("button", { type: "button", class: "icon-button" });
    setIcon(button, icon);
    button.addEventListener("click", onClick);
    return button;
  }

  function setIcon(button, icon) {
    button.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"'
      + ' stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[icon] + "</svg>";
  }

  function navButton() {
    var layoutElement = document.getElementById("layout");
    var button = iconButton("sidebar", function () { showNav(layoutElement.classList.contains("nav-hidden")); });
    button.setAttribute("aria-controls", "nav");
    function showNav(shown) {
      layoutElement.classList.toggle("nav-hidden", !shown);
      button.setAttribute("aria-expanded", String(shown));
      button.title = shown ? "Hide steps" : "Show steps";
      writeStorage(navKey, !shown);
    }
    showNav(readStorage(navKey, false) !== true);
    return button;
  }

  function currentTheme() {
    return document.documentElement.getAttribute("data-theme")
      || (darkQuery && darkQuery.matches ? "dark" : "light");
  }

  function themeButton() {
    var button = iconButton("moon", function () {
      var theme = currentTheme() === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", theme);
      writeStorage(themeKey, theme);
      showTheme();
    });
    button.id = "theme-button";
    showTheme(button);
    return button;
  }

  function showTheme(button) {
    button = button || document.getElementById("theme-button");
    if (!button) return;
    var dark = currentTheme() === "dark";
    setIcon(button, dark ? "sun" : "moon");
    button.title = dark ? "Switch to light theme" : "Switch to dark theme";
    button.setAttribute("aria-label", button.title);
  }

  function setLayout(name) {
    layout = name;
    writeStorage(layoutKey, name);
    Array.prototype.forEach.call(document.querySelectorAll("#toolbar button"), function (button) {
      button.setAttribute("aria-pressed", String(button.textContent.toLowerCase() === name));
    });
    views.forEach(function (view) {
      if (view.rendered) view.render();
    });
  }

  function renderIntro() {
    var panels = [];
    if (chapter.review.bodyHtml) {
      // Rendered from Markdown by git-stk with raw HTML and script links removed.
      var body = el("div", { class: "markdown" });
      body.innerHTML = chapter.review.bodyHtml;
      panels.push(el("div", { class: "panel" }, [el("h2", { text: "Description" }), body]));
    }
    if (chapter.commits.length) {
      panels.push(el("div", { class: "panel" }, [
        el("h2", { text: "Commits" }),
        el("ol", { class: "commits" }, chapter.commits.map(function (commit) {
          return el("li", {}, [el("code", { text: commit.sha }), commit.subject]);
        })),
      ]));
    }
    return el("div", { class: "intro" }, panels);
  }

  function renderNav() {
    var nav = document.getElementById("nav");
    nav.textContent = "";
    if (data.chapters.length > 1) renderStackNav(nav);
    nav.appendChild(el("h2", { text: "Tour" }));
    nav.appendChild(el("div", { class: "progress", id: "progress" }));
    nav.appendChild(el("ol", {}, chapter.steps.map(function (step, stepIndex) {
      var title = (stepIndex + 1) + ". " + step.title;
      var row = el("div", { class: "step-row" }, [
        reviewedBox(step, "Mark " + title + " reviewed"),
        el("a", { class: "step-link", "data-step-link": step.id, href: "#" + stepAnchor(stepIndex), text: title }),
      ]);
      var files = el("div", { class: "step-files" }, step.files.map(function (file, fileIndex) {
        return el("a", { href: "#" + stepAnchor(stepIndex) + "-file-" + fileIndex, title: file.path, text: file.path });
      }));
      return el("li", { class: "step" }, [row, files]);
    })));
    showProgress();
  }

  // The stack as `git stk list` shows it: the top review first, down to the
  // branch the stack lands on.
  function renderStackNav(nav) {
    nav.appendChild(el("h2", { text: "Stack" }));
    var items = data.chapters.map(function (other, index) {
      var link = el("a", { class: "chapter-link", href: "#c" + index, title: other.review.title || other.review.id }, [
        el("span", { class: "chapter-id", text: other.review.id }),
        " ",
        other.review.title || other.review.branch,
      ]);
      if (index === chapterIndex) link.setAttribute("aria-current", "page");
      return el("li", { class: "chapter" }, [link, el("span", { class: "chapter-progress", "data-chapter": index })]);
    }).reverse();
    nav.appendChild(el("ol", { class: "chapters" }, items));
    nav.appendChild(el("div", { class: "chapters-base" }, [el("code", { text: data.chapters[0].review.base })]));
  }

  function showProgress() {
    var done = chapter.steps.filter(function (step) { return reviewed[step.id]; }).length;
    document.getElementById("progress").textContent = done + " of " + chapter.steps.length + " steps reviewed";
    chapter.steps.forEach(function (step) {
      var link = document.querySelector('[data-step-link="' + step.id + '"]');
      if (link) link.classList.toggle("done", !!reviewed[step.id]);
    });
    data.chapters.forEach(function (other, index) {
      var progress = document.querySelector('[data-chapter="' + index + '"]');
      if (!progress) return;
      var marks = index === chapterIndex ? reviewed : readStorage(reviewedKeyFor(other), {});
      var count = other.steps.filter(function (step) { return marks[step.id]; }).length;
      progress.textContent = count + "/" + other.steps.length;
      progress.classList.toggle("done", count === other.steps.length);
    });
  }

  // A checkbox bound to a step's reviewed state; the sidebar and the step's
  // own heading each have one, kept in agreement.
  function reviewedBox(step, label) {
    var box = el("input", { type: "checkbox", "data-step": step.id });
    if (label) box.setAttribute("aria-label", label);
    box.checked = !!reviewed[step.id];
    box.addEventListener("change", function () {
      if (box.checked) reviewed[step.id] = true;
      else delete reviewed[step.id];
      writeStorage(reviewedKey, reviewed);
      Array.prototype.forEach.call(document.querySelectorAll('input[data-step="' + step.id + '"]'), function (other) {
        other.checked = box.checked;
      });
      showProgress();
    });
    return box;
  }

  function renderStep(step, stepIndex) {
    var box = reviewedBox(step, null);
    var head = el("div", { class: "step-head" }, [
      el("h2", { text: (stepIndex + 1) + ". " + step.title }),
      el("label", {}, [box, " Reviewed"]),
    ]);
    var files = step.files.map(function (file, fileIndex) {
      var view = new FileView(file, stepIndex, fileIndex, step.collapsed);
      views.push(view);
      return view.details;
    });
    var next = stepIndex + 1 < chapter.steps.length
      ? el("a", { class: "next", href: "#" + stepAnchor(stepIndex + 1), text: "Next: " + chapter.steps[stepIndex + 1].title })
      : null;
    return el("section", { class: "step", id: stepAnchor(stepIndex) }, [head].concat(files, [next]));
  }

  function renderChapterNav() {
    function link(index, label) {
      var other = data.chapters[index];
      if (!other) return el("span");
      return el("a", { href: "#c" + index }, [label + ": ", el("strong", { text: other.review.id }), " " + (other.review.title || other.review.branch)]);
    }
    if (data.chapters.length < 2) return null;
    return el("div", { class: "chapter-nav", role: "navigation", "aria-label": "Stack" }, [
      link(chapterIndex - 1, "Previous review"),
      link(chapterIndex + 1, "Next review"),
    ]);
  }

  // A file's diff is built the first time it is open and near the viewport,
  // so a large review opens quickly.
  function renderLazily() {
    if (!("IntersectionObserver" in window)) {
      views.forEach(function (view) { if (view.details.open) view.render(); });
      return;
    }
    var byElement = new Map(views.map(function (view) { return [view.details, view]; }));
    observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        var view = byElement.get(entry.target);
        view.visible = entry.isIntersecting;
        if (view.visible && view.details.open && !view.rendered) view.render();
      });
    }, { rootMargin: "800px 0px" });
    views.forEach(function (view) { observer.observe(view.details); });
  }

  var main = document.getElementById("main");

  function renderChapter(index) {
    chapterIndex = index;
    chapter = data.chapters[index];
    reviewedKey = reviewedKeyFor(chapter);
    reviewed = readStorage(reviewedKey, {});
    if (observer) observer.disconnect();
    views = [];
    main.textContent = "";
    main.appendChild(renderHeader());
    main.appendChild(renderIntro());
    chapter.steps.forEach(function (step, stepIndex) {
      main.appendChild(renderStep(step, stepIndex));
    });
    var chapterNav = renderChapterNav();
    if (chapterNav) main.appendChild(chapterNav);
    renderNav();
    renderLazily();
    var review = chapter.review;
    document.title = "Tour of " + (review.title ? review.title + " (" + review.id + ")" : review.id);
  }

  // The review a link points into: "#c2" or "#c2-step-0-file-1".
  function chapterOf(hash) {
    var match = /^#c(\d+)(-|$)/.exec(hash);
    var index = match ? Number(match[1]) : -1;
    return index < data.chapters.length ? index : -1;
  }

  // Show the target of the current link, switching reviews first if it is in
  // another one, and opening the file it names if that file is collapsed.
  function follow() {
    var index = chapterOf(location.hash);
    var switched = index >= 0 && index !== chapterIndex;
    if (switched) renderChapter(index);
    var target = location.hash ? document.getElementById(location.hash.slice(1)) : null;
    if (target && target.tagName === "DETAILS") target.open = true;
    if (switched) {
      if (target) target.scrollIntoView();
      else window.scrollTo(0, 0);
    }
  }

  if (darkQuery && darkQuery.addEventListener) darkQuery.addEventListener("change", function () { showTheme(); });
  window.addEventListener("hashchange", follow);
  var start = chapterOf(location.hash);
  renderChapter(start >= 0 ? start : data.current);
  if (location.hash) {
    var initial = document.getElementById(location.hash.slice(1));
    if (initial) {
      if (initial.tagName === "DETAILS") initial.open = true;
      initial.scrollIntoView();
    }
  }
})();
</script>
</body>
</html>
