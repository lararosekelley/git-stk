    return el("p", { class: "plan-attribution" }, parts);
  }

  // Text the tour agent wrote, marked beside it rather than inside it, so the
  // mark cannot land in a code block or a list the text opens with.
  function agentText(body, extraClass) {
    return el("div", { class: "agent-text" + (extraClass ? " " + extraClass : "") }, [
      el("span", { class: "agent-mark", title: "Written by the tour agent", "aria-label": "Written by the tour agent", text: "\u2728" }),
      body,
    ]);
  }

  // The agent's overall judgment: how confident it is the changeset ships
  // without a defect, what an unfound one would cost, and any question for
  // the author.
  function renderAssessment(assessment, followUp) {
    if (!assessment) return null;
    var parts = [];
    if (assessment.confidence !== null && assessment.confidence !== undefined) {
      var band = assessment.confidence >= 85 ? "high" : assessment.confidence >= 60 ? "medium" : "low";
      var before = followUp && followUp.confidence !== null && followUp.confidence !== undefined ? followUp.confidence : null;
      var delta = before === null ? null : assessment.confidence - before;
      parts.push(el("span", { class: "confidence confidence-" + band, title: "How likely the agent thinks this changeset is to reach production without a defect" }, [
        el("strong", { text: assessment.confidence }), "/100 confidence",
        delta === null ? null : el("span", { class: "confidence-delta", text: " (" + (delta > 0 ? "+" : "") + delta + " since " + followUp.head.slice(0, 7) + ")" }),
      ]));
    }
    if (assessment.risk) {
      parts.push(el("span", { class: "risk risk-" + assessment.risk, text: assessment.risk + " risk" }));
    }
    if (assessment.rationale) parts.push(el("span", { class: "risk-rationale", text: assessment.rationale }));
    var rows = [el("div", { class: "assessment-row" }, [el("span", { class: "agent-mark", "aria-hidden": "true", text: "\u2728" })].concat(parts))];
    if (assessment.questionHtml) {
      var question = el("div", { class: "markdown" });
      setMarkdown(question, assessment.questionHtml);
      var box = [el("div", { class: "note-label", text: "Question for the author" }), question];
      if (data.served) {
        var ask = el("button", { type: "button", text: "Ask in your review" });
        ask.addEventListener("click", function () {
          var key = draftsKey() + ":summary";
          var summary = readStorage(key, "");
          if (summary.indexOf(assessment.question) < 0) {
            writeStorage(key, summary ? summary + "\n\n" + assessment.question : assessment.question);
          }
          var panel = document.getElementById("review-panel");
          if (panel) panel.remove();
          openReview();
        });
        box.push(el("div", { class: "thread-actions" }, [ask]));
      }
      rows.push(el("div", { class: "assessment-question" }, box));
    }
    return el("div", { class: "assessment" }, rows);
  }

  var STATUSES = { fixed: "Fixed", open: "Still open", obsolete: "Obsolete", unclear: "Unclear" };

  // What became of the findings of the agent's review of an earlier head.
  function renderFollowUp(followUp) {
    if (!followUp || !followUp.findings.length) return null;
    var counts = ["fixed", "open", "obsolete", "unclear"].map(function (status) {
      var count = followUp.findings.filter(function (finding) { return finding.status === status; }).length;
      return count ? el("span", { class: "status status-" + status, text: count + " " + (STATUSES[status] || status).toLowerCase() }) : null;
    });
    return el("details", { class: "follow-up" }, [
      el("summary", {}, [el("span", { class: "agent-mark", "aria-hidden": "true", text: "\u2728" }), el("strong", { text: "Since the review of " }), el("code", { text: followUp.head.slice(0, 7) })].concat(counts)),
      el("ul", { class: "thread-index" }, followUp.findings.map(function (finding) {
        return el("li", {}, [
          el("span", { class: "status status-" + finding.status, text: STATUSES[finding.status] || finding.status }),
          el("code", { text: finding.path + ":" + finding.line }),
          el("span", { text: finding.title }),
          finding.note ? el("span", { class: "thread-excerpt", text: finding.note }) : null,
        ]);
      })),
    ]);
  }

  // The findings by severity, each linking to its file.
  function renderFindingIndex(plan) {
    var findings = plan.findings || [];
    if (!findings.length) return null;
    var anchors = {};
    chapter.steps.forEach(function (step, stepIndex) {
      step.files.forEach(function (file, fileIndex) {
        anchors[file.path] = stepAnchor(stepIndex) + "-file-" + fileIndex;
        if (file.oldPath) anchors[file.oldPath] = anchors[file.path];
      });
    });
    var open = openFindings(findings);
    var counts = ["required", "recommended", "optional"].map(function (severity) {
      var count = open.filter(function (finding) { return finding.severity === severity; }).length;
      return count ? el("span", { class: "severity severity-" + severity, text: count + " " + severity }) : null;
    });
    var dismissed = findings.length - open.length;
    return el("div", { class: "finding-index" }, [
      el("div", { class: "finding-counts" }, [el("span", { class: "agent-mark", text: "\u2728" }), el("strong", { text: plural(open.length, "finding", "findings") })].concat(counts, [
        dismissed ? el("span", { class: "thread-excerpt", text: dismissed + " dismissed" }) : null,
      ])),
      el("ul", { class: "thread-index" }, findings.map(function (finding) {
        return el("li", { class: isDismissed(finding) ? "dismissed" : null }, [
          el("span", { class: "severity severity-" + finding.severity, text: finding.severity }),
          el("a", { href: "#" + (anchors[finding.path] || "") }, [el("code", { text: finding.path + ":" + finding.line })]),
          el("span", { class: "thread-excerpt", text: finding.title }),
        ]);
      })),
    ]);
  }

  function renderPlan(plan) {
    var overview = null;
    if (plan.overviewHtml) {
      overview = el("div", { class: "markdown plan-overview" });
      setMarkdown(overview, plan.overviewHtml);
      overview = agentText(overview);
    }
    return el("section", { class: "plan", "aria-label": "Tour plan" }, [overview, renderAssessment(plan.assessment, plan.followUp), renderFollowUp(plan.followUp), renderFindingIndex(plan), planAttribution(plan)]);
  }

  function threadsOnFile(file) {
    return (discussion().threads || []).filter(function (thread) {
      return thread.path === file.path || (thread.side === "old" && thread.path === file.oldPath);
    });
  }

  // Rendered Markdown, with its links opening in a new tab: leaving the page
  // would close the tour.
  function setMarkdown(node, html) {
    node.innerHTML = html || "";
    Array.prototype.forEach.call(node.querySelectorAll("a[href]"), function (link) {
      if (link.getAttribute("href").charAt(0) === "#") return;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
    });
  }

  function when(at) {
    var date = at ? new Date(at) : null;
    return date && !isNaN(date) ? date.toLocaleString() : "";
  }

  // Bodies are rendered from Markdown by git-stk, with raw HTML removed.
  function renderComment(comment) {
    var body = el("div", { class: "markdown comment-body" });
    setMarkdown(body, comment.bodyHtml);
    var meta = el("div", { class: "comment-meta" }, [
      el("strong", { text: comment.author || "unknown" }),
      " ",
      comment.url ? el("a", { href: comment.url, target: "_blank", rel: "noopener", text: when(comment.at) || "link" }) : el("span", { text: when(comment.at) }),
    ]);
    return el("div", { class: "comment" }, [meta, body]);
  }

  // Post to the tour server, which asks in the terminal before posting
  // anything; show progress in `status`, and refresh the discussion after.
  function postAction(path, payload, status, asks) {
    status.className = "action-status";
    status.textContent = asks ? "Confirm in your terminal to post this." : "Saving...";
    payload.chapter = chapterIndex;
    return fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })
      .then(function (response) {
        return response.json().then(function (answer) { return { ok: response.ok, answer: answer }; });
      })
      .then(function (result) {
        if (!result.ok) {
          status.className = "action-status failed";
          status.textContent = result.answer.error || "That did not go through.";
          return false;
        }
        status.textContent = "";
        var refresh = document.getElementById("refresh-discussion");
        if (refresh) refresh.click();
        return true;
      })
      .catch(function () {
        status.className = "action-status failed";
        status.textContent = "The tour server did not answer; it may have stopped.";
        return false;
      });
  }

  function threadTarget(thread) {
    return { id: thread.id, path: thread.path, side: thread.side, line: thread.line, outdated: thread.outdated };
  }

  // Reply and resolve controls for a thread on a served page.
  function threadActions(thread) {
    if (!data.served) return null;
    var status = el("span", { class: "action-status" });
    var actions = el("div", { class: "thread-actions", "data-thread-id": thread.id });
    var reply = el("button", { type: "button", text: "Reply" });
    actions.appendChild(reply);
    if (data.resolvesThreads && thread.resolved !== null) {
      var toggle = el("button", { type: "button", text: thread.resolved ? "Reopen" : "Resolve" });
      toggle.addEventListener("click", function () {
        toggle.disabled = true;
        postAction("api/resolve", { thread: threadTarget(thread), resolved: !thread.resolved }, status, false)
          .then(function () { toggle.disabled = false; });
      });
      actions.appendChild(toggle);
    }
    actions.appendChild(status);
    reply.addEventListener("click", function () {
      if (actions.querySelector("textarea")) return;
      var text = el("textarea", { rows: "3", placeholder: "Reply" });
      var send = el("button", { type: "button", class: "primary", text: "Reply" });
      var cancel = el("button", { type: "button", text: "Cancel" });
      var editor = el("div", { class: "editor" }, [text, el("div", { class: "editor-actions" }, [cancel, send])]);
      actions.parentNode.insertBefore(editor, actions);
      text.focus();
      cancel.addEventListener("click", function () { editor.remove(); });
      send.addEventListener("click", function () {
        if (!text.value.trim()) return;
        send.disabled = true;
        postAction("api/reply", { thread: threadTarget(thread), body: text.value }, status, true)
          .then(function (posted) { if (posted) editor.remove(); else send.disabled = false; });
      });
    });
    return actions;
  }

  function renderThread(thread) {
    var parts = [];
    if (thread.outdated) {
      var where = thread.line === null ? "" : " line " + thread.line;
      parts.push(el("div", { class: "note-label", text: thread.path + where + ", on an earlier version" }));
      if (thread.diffHunk) parts.push(el("pre", { class: "thread-hunk", text: thread.diffHunk }));
    }
    thread.comments.forEach(function (comment) { parts.push(renderComment(comment)); });
    var actions = threadActions(thread);
    if (actions) parts.push(actions);
    if (thread.resolved) {
      var first = thread.comments[0];
      return el("details", { class: "thread resolved" }, [
        el("summary", { text: "Resolved thread" + (first ? " started by " + first.author : "") }),
      ].concat(parts));
    }
    return el("div", { class: "thread" }, parts);
  }

  var VERDICTS = {
    approved: "Approved",
    changes_requested: "Changes requested",
    commented: "Reviewed",
    dismissed: "Dismissed",
  };

  // Whether the discussion is open, kept across the re-renders a refresh does.
  var discussionOpen = false;

  // The plain text of rendered Markdown, cut to one line.
  function textOf(html) {
    var holder = document.createElement("div");
    holder.innerHTML = html || "";
    var text = (holder.textContent || "").replace(/\s+/g, " ").trim();
    return text.length > 90 ? text.slice(0, 87) + "..." : text;
  }

  function plural(count, one, many) {
    return count + " " + (count === 1 ? one : many);
  }

  // A one-line account of the discussion, so it can stay folded.
  function discussionSummary(conversation) {
    if (conversation.error) return "could not be loaded";
    var threads = conversation.threads || [];
    var open = threads.filter(function (thread) { return thread.resolved === false; }).length;
    var parts = [];
    var verdicts = (conversation.verdicts || []).length;
    var comments = (conversation.comments || []).length;
    if (verdicts) parts.push(plural(verdicts, "review", "reviews"));
    if (comments) parts.push(plural(comments, "comment", "comments"));
    if (threads.length) parts.push(plural(threads.length, "thread", "threads") + " on the code" + (open ? " (" + open + " open)" : ""));
    return parts.length ? parts.join(", ") : "no comments yet";
  }

  // The review's discussion that is not on a line of this diff - outcomes,
  // comments on the review, and threads on files the diff does not show -
  // with an index of the threads that are, linking to their files.
  function renderConversation() {
    var conversation = discussion();
    var panel = el("details", { class: "discussion" });
    panel.open = discussionOpen;
    panel.addEventListener("toggle", function () { discussionOpen = panel.open; });
    var summary = el("summary", {}, [
      el("span", { class: "discussion-title", text: "Discussion" }),
      el("span", { class: "discussion-counts", text: discussionSummary(conversation) }),
    ]);
    panel.appendChild(summary);
    if (conversation.error) {
      panel.appendChild(el("div", { class: "note", text: "The discussion could not be loaded: " + conversation.error }));
      return panel;
    }
    var items = (conversation.verdicts || []).map(function (verdict) {
      return { at: verdict.at, node: el("div", { class: "timeline-item" }, [
        el("span", { class: "verdict verdict-" + verdict.state, text: VERDICTS[verdict.state] || verdict.state }),
        renderComment(verdict),
      ]) };
    }).concat((conversation.comments || []).map(function (comment) {
      return { at: comment.at, node: el("div", { class: "timeline-item" }, [renderComment(comment)]) };
    }));
    items.sort(function (a, b) { return (a.at || "").localeCompare(b.at || ""); });
    // Each file's anchor, by its path either side of a rename.
    var paths = {};
    chapter.steps.forEach(function (step, stepIndex) {
      step.files.forEach(function (file, fileIndex) {
        var anchor = stepAnchor(stepIndex) + "-file-" + fileIndex;
        paths[file.path] = anchor;
        if (file.oldPath) paths[file.oldPath] = anchor;
      });
    });
    var elsewhere = (conversation.threads || []).filter(function (thread) { return !paths[thread.path]; });
    var inDiff = (conversation.threads || []).filter(function (thread) { return paths[thread.path]; });
    // Open threads first; the rest keep the forge's order.
    inDiff.sort(function (a, b) { return (b.resolved === false) - (a.resolved === false); });
    if (!items.length && !elsewhere.length && !(conversation.threads || []).length) {
      panel.appendChild(el("div", { class: "note", text: "No one has commented on this review yet." }));
    }
    if (inDiff.length) {
      panel.appendChild(el("div", { class: "note-label", text: "On the code, shown on their lines below:" }));
      panel.appendChild(el("ul", { class: "thread-index" }, inDiff.map(function (thread) {
        var first = thread.comments[0];
        var where = thread.path + (thread.line === null ? "" : ":" + thread.line);
        var state = thread.resolved ? "resolved" : thread.resolved === false ? "open" : "";
        return el("li", {}, [
          el("a", { href: "#" + paths[thread.path] }, [el("code", { text: where })]),
          state ? el("span", { class: "thread-state thread-state-" + state, text: state }) : null,
          thread.outdated ? el("span", { class: "thread-state", text: "outdated" }) : null,
          first ? el("span", { class: "thread-excerpt", text: (first.author ? first.author + ": " : "") + textOf(first.bodyHtml) }) : null,
        ]);
      })));
    }
    items.forEach(function (item) { panel.appendChild(item.node); });
    elsewhere.forEach(function (thread) {
      panel.appendChild(el("div", { class: "note-label", text: "On " + thread.path + ", which this diff does not change" }));
      panel.appendChild(renderThread(thread));
    });
    if (conversation.incomplete) {
      panel.appendChild(el("div", { class: "note" }, ["Some of the discussion was left out; ", el("a", { href: chapter.review.url, target: "_blank", rel: "noopener", text: "open the review" }), " to see all of it."]));
    }
    if (data.served) {
      var text = el("textarea", { rows: "3", placeholder: "Comment on this review" });
      var send = el("button", { type: "button", class: "primary", text: "Comment" });
      var status = el("span", { class: "action-status" });
      send.addEventListener("click", function () {
        if (!text.value.trim()) return;
        send.disabled = true;
        postAction("api/comment", { body: text.value }, status, true)
          .then(function (posted) { send.disabled = false; if (posted) text.value = ""; });
      });
      panel.appendChild(el("div", { class: "editor comment-box" }, [text, el("div", { class: "editor-actions" }, [status, send])]));
    }
    return panel;
  }

  // Text typed into the comment box and open reply editors, which a
  // refresh would otherwise throw away with the panel it rebuilds.
  function unsentText() {
    var unsent = { comment: "", replies: {}, lines: [] };
    Array.prototype.forEach.call(document.querySelectorAll("tr.editor-row"), function (row) {
      if (row.draft && row.text.value) unsent.lines.push({ draft: row.draft, text: row.text.value });
    });
    var box = document.querySelector(".comment-box textarea");
    if (box) unsent.comment = box.value;
    Array.prototype.forEach.call(document.querySelectorAll(".thread-actions[data-thread-id]"), function (actions) {
      var editor = actions.previousElementSibling;
      var text = editor && editor.classList.contains("editor") ? editor.querySelector("textarea") : null;
      if (text && text.value) unsent.replies[actions.getAttribute("data-thread-id")] = text.value;
    });
    return unsent;
  }

  function restoreText(unsent) {
    var box = document.querySelector(".comment-box textarea");
    if (box) box.value = unsent.comment;
    unsent.lines.forEach(function (line) {
      var draft = line.draft;
      var view = views.filter(function (candidate) { return candidate.file.path === draft.path; })[0];
      if (!view) return;
      if (!view.rendered) view.render();
      var tr = view.body.querySelector("tr[data-" + (draft.side === "old" ? "old" : "new") + '="' + draft.line + '"]');
      if (!tr) return;
      view.openEditor(tr, draft);
      tr.nextSibling.text.value = line.text;
    });
    Object.keys(unsent.replies).forEach(function (id) {
      var actions = [].find.call(document.querySelectorAll(".thread-actions[data-thread-id]"), function (candidate) {
        return candidate.getAttribute("data-thread-id") === id;
      });
      if (!actions) return;
      actions.querySelector("button").click();
      var editor = actions.previousElementSibling;
      if (editor) editor.querySelector("textarea").value = unsent.replies[id];
    });
  }

  function refreshConversation(button) {
    button.disabled = true;
    button.textContent = "Refreshing";
    var shown = chapterIndex;
    fetch("api/conversation?chapter=" + shown, { cache: "no-store" })
      .then(function (response) {
        return response.json().then(function (answer) {
          // A failed refresh keeps the discussion already shown.
          if (!response.ok || answer.error) throw new Error(answer.error || "refresh failed");
          return answer;
        });
      })
      .then(function (conversation) {
        data.chapters[shown].conversation = conversation;
        if (chapterIndex === shown) {
          var scroll = window.scrollY;
          var unsent = unsentText();
          renderChapter(shown);
          restoreText(unsent);
          window.scrollTo(0, scroll);
        }
      })
      .catch(function (error) {
        button.disabled = false;
        button.textContent = "Refresh failed; retry";
        button.title = error.message;
      });
  }

  function stepAnchor(stepIndex) {
    return "c" + chapterIndex + "-step-" + stepIndex;
  }

  function stepReviewed(step) {
    return step.files.length > 0 && step.files.every(function (file) { return viewed[file.patchId]; });
  }

  function setViewed(files, on) {
    files.forEach(function (file) {
      if (on) viewed[file.patchId] = 1;
      else delete viewed[file.patchId];
    });
    writeStorage(viewedKey, viewed);
    Array.prototype.forEach.call(document.querySelectorAll("input[data-patch]"), function (box) {
      box.checked = !!viewed[box.getAttribute("data-patch")];
    });
    chapter.steps.forEach(function (step) {
      Array.prototype.forEach.call(document.querySelectorAll('input[data-step="' + step.id + '"]'), function (box) {
        box.checked = stepReviewed(step);
      });
    });
    showProgress();
  }

  function renderHeader() {
    var review = chapter.review;
    var additions = 0;
    var deletions = 0;
    var files = 0;
    chapter.steps.forEach(function (step) {
      step.files.forEach(function (file) {
        files++;
        additions += file.additions;
        deletions += file.deletions;
      });
    });
    var stacked = data.chapters.length > 1
      ? el("span", { text: "review " + (chapterIndex + 1) + " of " + data.chapters.length + " in the stack" })
      : null;
    var meta = el("div", { class: "meta" }, [
      el("a", { href: review.url, target: "_blank", rel: "noopener noreferrer", text: review.id }),
      el("span", { class: "state state-" + review.state, text: review.state }),
      el("span", { class: "state state-reviewed", id: "reviewed-badge", text: "reviewed", hidden: "" }),
      el("span", {}, [el("code", { text: review.branch }), " into ", el("code", { text: review.base })]),
      stacked,
      el("span", { text: chapter.commits.length + (chapter.commits.length === 1 ? " commit" : " commits") }),
      el("span", {}, [
        files + (files === 1 ? " file " : " files "),
        el("span", { class: "count-add", text: "+" + additions }),
        " ",
        el("span", { class: "count-del", text: "-" + deletions }),
      ]),
    ]);
    var buttons = ["unified", "split"].map(function (name) {
      var button = el("button", { type: "button", "aria-pressed": String(layout === name), text: name === "split" ? "Split" : "Unified" });
      button.addEventListener("click", function () { setLayout(name); });
      return button;
    });
    var toolbar = el("div", { class: "toolbar", id: "toolbar" }, ["View:"].concat(buttons));
    if (data.served) {
      var refresh = el("button", { type: "button", id: "refresh-discussion", title: "Load new comments and reviews", text: "Refresh" });
      refresh.addEventListener("click", function () { refreshConversation(refresh); });
      var reviewButton = el("button", { type: "button", class: "review-button" }, ["Review ", el("span", { id: "draft-count", class: "draft-count" })]);
      reviewButton.addEventListener("click", openReview);
      toolbar.appendChild(el("span", { class: "toolbar-actions" }, [refresh, reviewButton]));
    }
    var top = el("div", { class: "header-top" }, [
      navButton(),
      el("h1", { text: review.title || review.id }),
      viButton(),
      themeButton(),
    ]);
    return el("header", { id: "c" + chapterIndex }, [top, meta, toolbar]);
  }

  function iconButton(icon, onClick) {
    var button = el("button", { type: "button", class: "icon-button" });
    setIcon(button, icon);
    button.addEventListener("click", onClick);
    return button;
  }

  function setIcon(button, icon) {
    button.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"'
      + ' stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[icon] + "</svg>";
  }

  function navButton() {
    var layoutElement = document.getElementById("layout");
    var button = iconButton("sidebar", function () { showNav(layoutElement.classList.contains("nav-hidden")); });
    button.classList.add("nav-toggle");
    button.setAttribute("aria-controls", "nav");
    function showNav(shown) {
      layoutElement.classList.toggle("nav-hidden", !shown);
      button.setAttribute("aria-expanded", String(shown));
      button.title = shown ? "Hide steps" : "Show steps";
      writeStorage(navKey, !shown);
    }
    showNav(readStorage(navKey, false) !== true);
    return button;
  }

  function currentTheme() {
    return document.documentElement.getAttribute("data-theme")
      || (darkQuery && darkQuery.matches ? "dark" : "light");
  }

  function themeButton() {
    var button = iconButton("moon", function () {
      var theme = currentTheme() === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", theme);
      writeStorage(themeKey, theme);
      showTheme();
    });
    button.id = "theme-button";
    showTheme(button);
    return button;
  }

  function showTheme(button) {
    button = button || document.getElementById("theme-button");
    if (!button) return;
    var dark = currentTheme() === "dark";
    setIcon(button, dark ? "sun" : "moon");
    button.title = dark ? "Switch to light theme" : "Switch to dark theme";
    button.setAttribute("aria-label", button.title);
  }

  function setLayout(name) {
    layout = name;
    writeStorage(layoutKey, name);
    Array.prototype.forEach.call(document.querySelectorAll("#toolbar button"), function (button) {
      button.setAttribute("aria-pressed", String(button.textContent.toLowerCase() === name));
    });
    views.forEach(function (view) {
      if (view.rendered) view.render();
    });
  }

  function renderIntro() {
    var parts = [];
    if (chapter.plan) parts.push(renderPlan(chapter.plan));
    if (chapter.review.bodyHtml) {
      // Rendered from Markdown by git-stk with raw HTML and script links removed.
      var body = el("div", { class: "markdown description" });
      setMarkdown(body, chapter.review.bodyHtml);
      parts.push(body);
    } else {
      parts.push(el("p", { class: "description empty", text: "This review has no description." }));
    }
    if (chapter.commits.length) {
      parts.push(el("ol", { class: "commits", "aria-label": "Commits" }, chapter.commits.map(function (commit) {
        return el("li", {}, [el("code", { text: commit.sha }), el("span", { text: commit.subject })]);
      })));
    }
    parts.push(renderConversation());
    return el("div", { class: "intro" }, parts);
  }

  var LOGO = '<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="7" y="16" width="37" height="12" rx="6" fill="#cc6699"/><rect x="20" y="36" width="37" height="12" rx="6" fill="#cc6699"/></svg>';

  function renderNav() {
    var nav = document.getElementById("nav");
    nav.textContent = "";
    var brand = el("div", { class: "brand" }, ["git-stk tour"]);
    brand.insertAdjacentHTML("afterbegin", LOGO);
    nav.appendChild(brand);
    if (data.chapters.length > 1) renderStackNav(nav);
    nav.appendChild(el("h2", { text: "Steps" }));
    nav.appendChild(el("div", { class: "progress", id: "progress" }));
    nav.appendChild(el("ol", { class: "rail steps" }, chapter.steps.map(function (step, stepIndex) {
      var title = step.title;
      var row = el("div", { class: "step-row" }, [
        reviewedBox(step, "Mark " + title + " reviewed"),
        el("a", { class: "step-link", "data-step-link": step.id, href: "#" + stepAnchor(stepIndex), text: title }),
      ]);
      var files = el("div", { class: "step-files" }, step.files.map(function (file, fileIndex) {
        return el("a", { href: "#" + stepAnchor(stepIndex) + "-file-" + fileIndex, title: file.path, text: file.path });
      }));
      return el("li", { class: "step rail-item" }, [row, files]);
    })));
    showProgress();
  }

  // The stack as `git stk list` shows it: the top review first, down to the
  // branch the stack lands on.
  function renderStackNav(nav) {
    nav.appendChild(el("h2", { text: "Stack" }));
    var items = data.chapters.map(function (other, index) {
      var link = el("a", { class: "chapter-link", href: "#c" + index, title: other.review.title || other.review.id }, [
        el("span", { class: "chapter-id", text: other.review.id }),
        " ",
        other.review.title || other.review.branch,
      ]);
      if (index === chapterIndex) link.setAttribute("aria-current", "page");
      return el("li", { class: "chapter rail-item" + (index === chapterIndex ? " current" : "") }, [link, el("span", { class: "chapter-progress", "data-chapter": index })]);
    }).reverse();
    items.push(el("li", { class: "chapter rail-item trunk" }, [el("code", { text: data.chapters[0].review.base })]));
    nav.appendChild(el("ol", { class: "rail chapters" }, items));
  }

  function showProgress() {
    var done = chapter.steps.filter(stepReviewed).length;
    document.getElementById("progress").textContent = done + " of " + chapter.steps.length + " steps reviewed";
    var badge = document.getElementById("reviewed-badge");
    if (badge) badge.hidden = done !== chapter.steps.length;
    chapter.steps.forEach(function (step) {
      var link = document.querySelector('[data-step-link="' + step.id + '"]');
      if (link) link.classList.toggle("done", stepReviewed(step));
      var number = document.querySelector('[data-step-number="' + step.id + '"]');
      if (number) number.classList.toggle("done", stepReviewed(step));
    });
    data.chapters.forEach(function (other, index) {
      var progress = document.querySelector('[data-chapter="' + index + '"]');
      if (!progress) return;
      var count = other.steps.filter(stepReviewed).length;
      var finished = count === other.steps.length;
      progress.textContent = count + "/" + other.steps.length;
      progress.classList.toggle("done", finished);
      progress.parentNode.classList.toggle("done", finished);
      progress.title = finished ? "Every step reviewed" : count + " of " + other.steps.length + " steps reviewed";
    });
  }

  // A checkbox bound to a step's reviewed state; the sidebar and the step's
  // own heading each have one, kept in agreement.
  function reviewedBox(step, label) {
    var box = el("input", { type: "checkbox", "data-step": step.id });
    if (label) box.setAttribute("aria-label", label);
    box.checked = stepReviewed(step);
    box.addEventListener("change", function () { setViewed(step.files, box.checked); });
    return box;
  }

  function renderStep(step, stepIndex) {
    var box = reviewedBox(step, null);
    var head = el("div", { class: "step-head" }, [
      el("h2", {}, [el("span", { class: "step-number", "data-step-number": step.id, text: String(stepIndex + 1) }), step.title]),
      el("label", { class: "reviewed-toggle" }, [box, " Reviewed"]),
    ]);
    var summary = null;
    if (step.summary) {
      summary = el("div", { class: "markdown" });
      setMarkdown(summary, step.summary);
      summary = agentText(summary, "step-summary");
    }
    var files = step.files.map(function (file, fileIndex) {
      var view = new FileView(file, stepIndex, fileIndex, step.collapsed);
      views.push(view);
      return view.details;
    });
    var next = stepIndex + 1 < chapter.steps.length
      ? el("a", { class: "next", href: "#" + stepAnchor(stepIndex + 1), text: "Next: " + chapter.steps[stepIndex + 1].title })
      : null;
    return el("section", { class: "step", id: stepAnchor(stepIndex) }, [head, summary].concat(files, [next]));
  }

  function renderChapterNav() {
    function link(index, label) {
      var other = data.chapters[index];
      if (!other) return el("span");
      return el("a", { href: "#c" + index }, [label + ": ", el("strong", { text: other.review.id }), " " + (other.review.title || other.review.branch)]);
    }
    if (data.chapters.length < 2) return null;
    return el("div", { class: "chapter-nav", role: "navigation", "aria-label": "Stack" }, [
      link(chapterIndex - 1, "Previous review"),
      link(chapterIndex + 1, "Next review"),
    ]);
  }

  // A file's diff is built the first time it is open and near the viewport,
  // so a large review opens quickly.
  function renderLazily() {
    if (!("IntersectionObserver" in window)) {
      views.forEach(function (view) { if (view.details.open) view.render(); });
      return;
    }
    var byElement = new Map(views.map(function (view) { return [view.details, view]; }));
    observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        var view = byElement.get(entry.target);
        view.visible = entry.isIntersecting;
        if (view.visible && view.details.open && !view.rendered) view.render();
      });
    }, { rootMargin: "800px 0px" });
    views.forEach(function (view) { observer.observe(view.details); });
  }

  var main = document.getElementById("main");

  function renderChapter(index) {
    chapterIndex = index;
    chapter = data.chapters[index];
    if (observer) observer.disconnect();
    views = [];
    main.textContent = "";
    var header = renderHeader();
    main.appendChild(header);
    trackHeaderHeight(header);
    main.appendChild(renderIntro());
    chapter.steps.forEach(function (step, stepIndex) {
      main.appendChild(renderStep(step, stepIndex));
    });
    var chapterNav = renderChapterNav();
    if (chapterNav) main.appendChild(chapterNav);
    renderNav();
    renderLazily();
    showDraftCount();
    var stale = document.getElementById("review-panel");
    if (stale) stale.remove();
    var review = chapter.review;
    document.title = "Tour of " + (review.title ? review.title + " (" + review.id + ")" : review.id);
  }

  // The pinned header's height, so file headers stick below it and links
  // land clear of it.
  var headerObserver = null;
  function trackHeaderHeight(header) {
    function measure() {
      document.documentElement.style.setProperty("--header-height", header.offsetHeight + "px");
    }
    if (headerObserver) headerObserver.disconnect();
    if ("ResizeObserver" in window) {
      headerObserver = new ResizeObserver(measure);
      headerObserver.observe(header);
    }
    measure();
  }

  // The review a link points into: "#c2" or "#c2-step-0-file-1".
  function chapterOf(hash) {
    var match = /^#c(\d+)(-|$)/.exec(hash);
    var index = match ? Number(match[1]) : -1;
    return index < data.chapters.length ? index : -1;
  }

  // Show the target of the current link, switching reviews first if it is in
  // another one, and opening the file it names if that file is collapsed.
  function follow() {
    var index = chapterOf(location.hash);
    var switched = index >= 0 && index !== chapterIndex;
    if (switched) renderChapter(index);
    var target = location.hash ? document.getElementById(location.hash.slice(1)) : null;
    if (target && target.tagName === "DETAILS") target.open = true;
    if (switched) {
      if (target) target.scrollIntoView();
      else window.scrollTo(0, 0);
    }
  }

  // Vi mode: j/k to scroll, gg/G for the ends, ]/[ between files, }/{ between
  // steps, and a leader key, then a letter, for the rest. Off until turned on
  // in its popup, where the leader and how long it waits are chosen too.
  var viKey = "git-stk-tour:vi";
  var LEADERS = { ",": "Comma", " ": "Space", "\\": "Backslash", ";": "Semicolon" };
  var LEADER_COMMANDS = [
    ["n", "next review in the stack"],
    ["p", "previous review in the stack"],
    ["1-9", "step by number"],
    ["r", "mark this step reviewed"],
    ["v", "mark this file viewed"],
    ["o", "open or fold this file"],
    ["s", "split or unified view"],
    ["t", "light or dark theme"],
    ["b", "show or hide the sidebar"],
    ["c", "the review panel"],
  ];
  var MOTIONS = [
    ["j / k", "scroll down / up"],
    ["gg / G", "top / bottom"],
    ["] / [", "next / previous file"],
    ["} / {", "next / previous step"],
    ["?", "this popup"],
    ["Esc", "cancel"],
  ];
  var vi = (function () {
    var stored = readStorage(viKey, {});
    return {
      enabled: stored.enabled === true,
      leader: Object.prototype.hasOwnProperty.call(LEADERS, stored.leader) ? stored.leader : ",",
      timeout: typeof stored.timeout === "number" && stored.timeout >= 0 ? stored.timeout : 2000,
    };
  })();
  var leaderPending = false;
  var leaderTimer = null;
  var gPending = false;
  var gTimer = null;

  function saveVi() {
    writeStorage(viKey, vi);
    var button = document.getElementById("vi-button");
    if (button) button.setAttribute("aria-pressed", String(vi.enabled));
  }

  function viButton() {
    var button = iconButton("keyboard", toggleViSettings);
    button.id = "vi-button";
    button.title = "Vi mode";
    button.setAttribute("aria-label", "Vi mode settings");
    button.setAttribute("aria-pressed", String(vi.enabled));
    return button;
  }

  function toggleViSettings() {
    if (document.getElementById("vi-settings")) { closeViSettings(); return; }
    var enabled = el("input", { type: "checkbox" });
    enabled.checked = vi.enabled;
    enabled.addEventListener("change", function () {
      vi.enabled = enabled.checked;
      if (!vi.enabled) cancelLeader();
      saveVi();
    });
    var leader = el("select", { "aria-label": "Leader key" }, Object.keys(LEADERS).map(function (key) {
      var option = el("option", { value: key, text: LEADERS[key] });
      option.selected = key === vi.leader;
      return option;
    }));
    leader.addEventListener("change", function () { vi.leader = leader.value; saveVi(); });
    var timeout = el("input", { type: "number", min: "0", step: "100", value: String(vi.timeout), "aria-label": "Leader timeout in milliseconds" });
    timeout.addEventListener("change", function () {
      var value = parseInt(timeout.value, 10);
      if (!isNaN(value) && value >= 0) { vi.timeout = value; saveVi(); }
      else timeout.value = String(vi.timeout);
    });
    function keys(rows) {
      return el("table", { class: "vi-keys" }, [el("tbody", {}, rows.map(function (row) {
        return el("tr", {}, [el("td", {}, [el("kbd", { text: row[0] })]), el("td", { text: row[1] })]);
      }))]);
    }
    var close = el("button", { type: "button", text: "Close" });
    var panel = el("div", { id: "vi-settings", class: "vi-settings", role: "dialog", "aria-label": "Vi mode" }, [
      el("h2", { text: "Vi mode" }),
      el("label", { class: "vi-row" }, [enabled, " Use vi keys on this page"]),
      el("label", { class: "vi-row" }, ["Leader ", leader]),
      el("label", { class: "vi-row" }, ["Leader timeout ", timeout, " ms"]),
      el("div", { class: "vi-note", text: "0 waits for the next key however long it takes." }),
      el("div", { class: "note-label", text: "Keys" }),
      keys(MOTIONS),
      el("div", { class: "note-label", text: "After the leader" }),
      keys(LEADER_COMMANDS),
      el("div", { class: "editor-actions" }, [close]),
    ]);
    close.addEventListener("click", closeViSettings);
    document.body.appendChild(panel);
  }

  function cancelLeader() {
    leaderPending = false;
    if (leaderTimer) clearTimeout(leaderTimer);
    leaderTimer = null;
    var hints = document.getElementById("vi-hints");
    if (hints) hints.remove();
  }

  function startLeader() {
    leaderPending = true;
    document.body.appendChild(el("div", { id: "vi-hints", class: "vi-hints", role: "status" },
      LEADER_COMMANDS.map(function (row) {
        return el("div", {}, [el("kbd", { text: row[0] }), " " + row[1]]);
      })));
    if (vi.timeout > 0) leaderTimer = setTimeout(cancelLeader, vi.timeout);
  }

  function scrollBehavior() {
    return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
  }

  // Where the pinned header ends, the line the reader is reading at.
  function readingLine() {
    return (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--header-height")) || 0) + 24;
  }

  // The last element of `selector` whose top has passed the reading line, or
  // null before the first.
  function passedOf(selector) {
    var line = readingLine();
    var passed = Array.prototype.filter.call(main.querySelectorAll(selector), function (node) {
      return node.getBoundingClientRect().top <= line;
    });
    return passed.length ? passed[passed.length - 1] : null;
  }

  // The element of `selector` the reader is at, the first until one passes.
  function currentOf(selector) {
    return passedOf(selector) || main.querySelector(selector);
  }

  function jump(selector, forward) {
    var all = Array.prototype.slice.call(main.querySelectorAll(selector));
    var current = passedOf(selector);
    var index = all.indexOf(current);
    var line = readingLine();
    // Going back from partway into an element lands on its own start first.
    var target = forward ? all[index + 1]
      : current && current.getBoundingClientRect().top < line - 30 ? current : all[index - 1];
    if (target) target.scrollIntoView({ behavior: scrollBehavior() });
  }

  function currentStep() {
    var section = currentOf("section.step");
    if (!section) return null;
    return chapter.steps.filter(function (step, index) { return stepAnchor(index) === section.id; })[0] || null;
  }

  function currentFileView() {
    var details = currentOf("details.file");
    return views.filter(function (view) { return view.details === details; })[0] || null;
  }

  function runLeader(key) {
    var step;
    var view;
    if (key === "n" || key === "p") {
      var next = chapterIndex + (key === "n" ? 1 : -1);
      if (next >= 0 && next < data.chapters.length) location.hash = "#c" + next;
    } else if (/^[1-9]$/.test(key)) {
      var index = Number(key) - 1;
      if (index < chapter.steps.length) location.hash = "#" + stepAnchor(index);
    } else if (key === "r" && (step = currentStep())) {
      setViewed(step.files, !stepReviewed(step));
    } else if (key === "v" && (view = currentFileView())) {
      setViewed([view.file], !viewed[view.file.patchId]);
    } else if (key === "o" && (view = currentFileView())) {
      view.details.open = !view.details.open;
    } else if (key === "s") {
      setLayout(layout === "split" ? "unified" : "split");
    } else if (key === "t") {
      var themeToggle = document.getElementById("theme-button");
      if (themeToggle) themeToggle.click();
    } else if (key === "b") {
      var sidebar = document.querySelector(".nav-toggle");
      if (sidebar) sidebar.click();
    } else if (key === "c" && data.served) {
      if (!document.getElementById("review-panel")) openReview();
    }
  }

  // Whether keys go into a field rather than to vi; a checkbox or a button
  // takes no text.
  function typing(target) {
    if (!target) return false;
    if (target.tagName === "INPUT") return !/^(checkbox|radio|button|submit|reset)$/.test(target.type);
    return target.isContentEditable || /^(TEXTAREA|SELECT)$/.test(target.tagName);
  }

  function closeViSettings() {
    var settings = document.getElementById("vi-settings");
    if (!settings) return;
    settings.remove();
    var button = document.getElementById("vi-button");
    if (button) button.focus();
  }

  document.addEventListener("keydown", function (event) {
    var key = event.key;
    if (key === "Escape") {
      cancelLeader();
      closeViSettings();
      return;
    }
    if (!vi.enabled || event.ctrlKey || event.metaKey || event.altKey || typing(event.target)) return;
    if (/^(Shift|Control|Alt|Meta|CapsLock)$/.test(key)) return;
    if (leaderPending) {
      event.preventDefault();
      cancelLeader();
      runLeader(key);
      return;
    }
    if (key === vi.leader) {
      event.preventDefault();
      startLeader();
      return;
    }
    var handled = true;
    if (key === "j" || key === "k") {
      window.scrollBy({ top: (key === "j" ? 1 : -1) * window.innerHeight * 0.4, behavior: scrollBehavior() });
    } else if (key === "G") {
      gPending = false;
      window.scrollTo({ top: document.body.scrollHeight, behavior: scrollBehavior() });
    } else if (key === "g") {
      if (gPending) {
        gPending = false;
        window.scrollTo({ top: 0, behavior: scrollBehavior() });
      } else {
        gPending = true;
        if (gTimer) clearTimeout(gTimer);
        gTimer = setTimeout(function () { gPending = false; }, 500);
      }
    } else if (key === "]" || key === "[") {
      jump("details.file", key === "]");
    } else if (key === "}" || key === "{") {
      jump("section.step", key === "}");
    } else if (key === "?") {
      toggleViSettings();
    } else {
      handled = false;
    }
    if (handled) event.preventDefault();
  });

  // While the page is open, the tour server stays up; it stops once the last
  // tab closes or stops checking in.
  if (data.served) {
    var tab = JSON.stringify(Math.random().toString(36).slice(2) + Date.now().toString(36));
    var beat = function () {
      fetch("api/alive", { method: "POST", headers: { "Content-Type": "application/json" }, body: tab })
        .catch(function () {});
    };
    beat();
    setInterval(beat, 5000);
    // A hidden tab's timers are slowed; check in as soon as it shows again.
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") beat();
    });
    window.addEventListener("pagehide", function () {
      fetch("api/closed", { method: "POST", headers: { "Content-Type": "application/json" }, body: tab, keepalive: true })
        .catch(function () {});
    });
  }

  if (darkQuery && darkQuery.addEventListener) darkQuery.addEventListener("change", function () { showTheme(); });
  window.addEventListener("hashchange", follow);
  var start = chapterOf(location.hash);
  renderChapter(start >= 0 ? start : data.current);
  if (location.hash) {
    var initial = document.getElementById(location.hash.slice(1));
    if (initial) {
      if (initial.tagName === "DETAILS") initial.open = true;
      initial.scrollIntoView();
    }
  }
})();
</script>
</body>
</html>
