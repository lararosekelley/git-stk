# Live end-to-end test against a real provider. Creates an ephemeral repo, runs
# the core stacked-branch lifecycle with the freshly built git-stk, and deletes
# the repo afterwards.
#
# Triggers:
#   - workflow_dispatch: run by hand on main.
#   - workflow_call: invoked by the dist-generated release.yml as a `plan-jobs`
#     custom job, so a failing live run blocks the release before anything is
#     built or published (see dist-workspace.toml).
#
# Matrix: GitHub on each OS (macOS=zsh, linux=bash, windows=pwsh - three shells),
# plus a GitLab cell and a Gitea cell on ubuntu (Gitea runs against a throwaway
# Dockerized instance, so it needs no account or secret). Only ubuntu+github
# exercises `merge --all --wait`
# (the grace-window path); the rest use `--no-wait` to keep runs fast - the wait
# path only needs proving once. Matrix expressions aren't allowed in `shell:`, so
# the zsh run is split out with a literal shell gated by `if:`, sharing env via a
# YAML anchor.
name: E2E

on:
  workflow_dispatch:
  workflow_call:
    # cargo-dist passes the release plan to every custom job; unused here.
    inputs:
      plan:
        required: false
        type: string

permissions:
  contents: read

jobs:
  e2e:
    # The dist-generated release.yml triggers on pull_request (for `dist plan`)
    # and invokes this as a plan-job, which would otherwise run the whole live
    # suite on every PR - and fail on fork PRs that can't see the secrets. This
    # is a release gate (tag pushes) and manual dispatch only.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, provider: github, wait: true }
          - { os: macos-latest, provider: github }
          - { os: windows-latest, provider: github }
          - { os: ubuntu-latest, provider: gitlab }
          - { os: ubuntu-latest, provider: gitea }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build git-stk and the e2e harness
        run: cargo build --features e2e --bin git-stk --bin git-stk-e2e

      # Per-shell completions + setup + uninstall: generate the completion
      # script for the cell's native shell and confirm that shell parses it,
      # then run `git stk setup -y` (confirm it wired the right rc) and
      # `git stk uninstall -y` (confirm it un-wired it) - the real payoff of
      # running each cell on bash/zsh/pwsh. `$SHELL` steers setup's shell
      # detection. Matrix expressions aren't allowed in `shell:`, so one
      # literal-shell step per OS, gated by `if:`.
      - name: Completions, setup, uninstall (bash)
        if: runner.os == 'Linux'
        shell: bash
        env:
          SHELL: /bin/bash
        run: |
          ./target/debug/git-stk completions bash > comp.bash
          test -s comp.bash
          bash -n comp.bash
          ./target/debug/git-stk setup -y
          grep -q "git stk completions bash" "$HOME/.bashrc"
          ./target/debug/git-stk uninstall -y
          if grep -q "git stk completions bash" "$HOME/.bashrc"; then
            echo "uninstall left the bash rc wired"; exit 1
          fi

      - name: Completions, setup, uninstall (zsh)
        if: runner.os == 'macOS'
        shell: zsh {0}
        env:
          SHELL: /bin/zsh
        run: |
          set -e
          ./target/debug/git-stk completions zsh > comp.zsh
          test -s comp.zsh
          zsh -n comp.zsh
          ./target/debug/git-stk setup -y
          grep -q "git stk completions zsh" "$HOME/.zshrc"
          ./target/debug/git-stk uninstall -y
          if grep -q "git stk completions zsh" "$HOME/.zshrc"; then
            echo "uninstall left the zsh rc wired"; exit 1
          fi

      - name: Completions, setup, uninstall (pwsh)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $script = & ./target/debug/git-stk.exe completions powershell | Out-String
          if ([string]::IsNullOrWhiteSpace($script)) { throw 'empty completion script' }
          $script | Invoke-Expression
          & ./target/debug/git-stk.exe setup -y
          if ($LASTEXITCODE -ne 0) { throw 'setup failed' }
          if (-not (Select-String -Path $PROFILE -Pattern 'git stk completions powershell' -Quiet)) {
            throw 'setup did not wire the PowerShell profile'
          }
          & ./target/debug/git-stk.exe uninstall -y
          if ($LASTEXITCODE -ne 0) { throw 'uninstall failed' }
          if (Select-String -Path $PROFILE -Pattern 'git stk completions powershell' -Quiet) {
            throw 'uninstall left the PowerShell profile wired'
          }

      # gh is preinstalled on GitHub runners; wire it to git so pushes over
      # HTTPS authenticate with the PAT.
      - name: Configure gh auth
        if: matrix.provider == 'github'
        env:
          GH_TOKEN: ${{ secrets.E2E_GH_TOKEN }}
        run: gh auth setup-git

      # glab isn't preinstalled (and Homebrew isn't on the runner PATH). Install
      # the official .deb from the latest GitLab CLI release - it lands on
      # /usr/bin, already on PATH for later steps. Then store a git credential
      # for HTTPS pushes to gitlab.com (the token is written to a file, never
      # echoed).
      - name: Install glab + configure git auth (GitLab)
        if: matrix.provider == 'gitlab'
        env:
          GITLAB_TOKEN: ${{ secrets.E2E_GITLAB_TOKEN }}
        run: |
          api="https://gitlab.com/api/v4/projects/gitlab-org%2Fcli/releases/permalink/latest"
          url=$(curl -fsSL "$api" \
            | jq -r '.assets.links[] | select(.name | test("linux.*(amd64|x86_64).*\\.deb$"; "i")) | .url' \
            | head -1)
          if [ -z "$url" ]; then
            echo "no matching glab .deb asset; available assets:"
            curl -fsSL "$api" | jq -r '.assets.links[].name'
            exit 1
          fi
          echo "installing glab from: $url"
          curl -fsSL -o /tmp/glab.deb "$url"
          sudo dpkg -i /tmp/glab.deb
          glab --version
          git config --global credential.helper store
          printf 'https://oauth2:%s@gitlab.com\n' "$GITLAB_TOKEN" > "$HOME/.git-credentials"
          chmod 600 "$HOME/.git-credentials"

      # Gitea is self-hosted: stand up a throwaway instance in Docker (no
      # account or secret needed), seed an admin + token, install tea, log in,
      # and store a git credential for HTTPS pushes. The token is generated at
      # runtime and exported to later steps via $GITHUB_ENV.
      - name: Start Gitea + tea (Gitea)
        if: matrix.provider == 'gitea'
        run: |
          docker run -d --name gitea -p 3000:3000 \
            -e GITEA__security__INSTALL_LOCK=true \
            -e GITEA__server__ROOT_URL=http://localhost:3000/ \
            gitea/gitea:1.22
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000/api/v1/version >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec -u git gitea gitea admin user create \
            --username e2e --password e2epass123 --email e2e@example.com \
            --admin --must-change-password=false
          token=$(curl -fsS -u e2e:e2epass123 -X POST \
            http://localhost:3000/api/v1/users/e2e/tokens \
            -H 'Content-Type: application/json' \
            -d '{"name":"e2e","scopes":["all"]}' | jq -r .sha1)
          curl -fsSL https://dl.gitea.com/tea/0.14.1/tea-0.14.1-linux-amd64 -o /tmp/tea
          sudo install -m755 /tmp/tea /usr/local/bin/tea
          tea login add --name e2e --url http://localhost:3000 --token "$token"
          git config --global credential.helper store
          printf 'http://e2e:%s@localhost:3000\n' "$token" > "$HOME/.git-credentials"
          chmod 600 "$HOME/.git-credentials"
          echo "GITEA_TOKEN=$token" >> "$GITHUB_ENV"

      # linux=bash, windows=pwsh (runner defaults). Gitea has its own run step.
      - name: Run e2e
        if: runner.os != 'macOS' && matrix.provider != 'gitea'
        env: &e2e_env
          STK_E2E_PROVIDER: ${{ matrix.provider }}
          # Owner for the ephemeral repo; override with an E2E_OWNER repo
          # variable to point at a dedicated test org.
          STK_E2E_OWNER: ${{ vars.E2E_OWNER || github.repository_owner }}
          # Only the cell with matrix.wait set uses `merge --all --wait`.
          STK_E2E_WAIT: ${{ matrix.wait }}
          # The harness under test needs the .exe suffix on Windows.
          GIT_STK_BIN: ${{ github.workspace }}/target/debug/git-stk${{ runner.os == 'Windows' && '.exe' || '' }}
          GH_TOKEN: ${{ secrets.E2E_GH_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.E2E_GITLAB_TOKEN }}
        run: cargo run --features e2e --bin git-stk-e2e

      # macOS runs the harness under zsh; env reused from the anchor above.
      - name: Run e2e (macOS / zsh)
        if: runner.os == 'macOS'
        shell: zsh {0}
        env: *e2e_env
        run: cargo run --features e2e --bin git-stk-e2e

      # Gitea: owner is the seeded admin user, the instance is the local Docker
      # service, and GITEA_TOKEN comes from the setup step's $GITHUB_ENV export.
      - name: Run e2e (Gitea)
        if: matrix.provider == 'gitea'
        env:
          STK_E2E_PROVIDER: gitea
          STK_E2E_OWNER: e2e
          STK_E2E_GITEA_URL: http://localhost:3000
          STK_E2E_GITEA_LOGIN: e2e
          GIT_STK_BIN: ${{ github.workspace }}/target/debug/git-stk
        run: cargo run --features e2e --bin git-stk-e2e
